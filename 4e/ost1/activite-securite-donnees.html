<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAG et sécurité des données</title>
<style>
:root{--bleu:#1f4e79;--bleu2:#2e75b6;--bleuf:#e8f1fa;--orange:#d97706;--orangeF:#fdf1e0;--vert:#2e7d32;--vertF:#e8f5e9;--rouge:#b3261e;--rougeF:#fdecea;--gris:#5b6b7b;--bord:#c9d6e4;--noir:#1f2933}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Liberation Sans",Arial,sans-serif;font-size:17px;line-height:1.5;color:var(--noir);background:#f4f8fc}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--bleu2);padding:10px 16px;box-shadow:0 2px 6px rgba(31,78,121,.08)}
h1{font-size:1.2rem;color:var(--bleu)}h1 small{display:block;font-weight:normal;font-size:.75rem;color:var(--gris)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tabs button{font:inherit;font-size:.88rem;padding:8px 14px;border:2px solid var(--bleu2);background:#fff;color:var(--bleu);border-radius:999px;cursor:pointer;transition:all .2s}
.tabs button.active{background:var(--bleu2);color:#fff}.tabs button:hover:not(.active){background:var(--bleuf)}
main{padding:16px;max-width:900px;margin:0 auto}
section{display:none;animation:fadeIn .3s}section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.badge{display:inline-block;font-size:.7rem;font-weight:bold;text-transform:uppercase;letter-spacing:.04em;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.badge.n1{background:#dbeafe;color:#1e40af}.badge.n2{background:#fef3c7;color:#92400e}.badge.n3{background:#d1fae5;color:#065f46}.badge.n4{background:#fce7f3;color:#9d174d}
h2{font-size:1.15rem;color:var(--bleu);margin:0 0 8px}h3{font-size:1.05rem;color:var(--bleu);margin:12px 0 6px}
p{margin:6px 0}
.btn{font:inherit;font-size:1rem;padding:10px 20px;border:none;border-radius:10px;background:var(--bleu2);color:#fff;cursor:pointer;font-weight:bold}
.btn:hover{background:var(--bleu)}.btn:disabled{background:#c3d3e3;cursor:default}
.btn.sec{background:#fff;color:var(--bleu);border:2px solid var(--bleu2)}.btn.sec:hover{background:var(--bleuf)}
.info{background:var(--bleuf);border-left:5px solid var(--bleu2);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:.95rem}
.success{background:var(--vertF);border-left-color:var(--vert)}.error{background:var(--rougeF);border-left-color:var(--rouge)}
.opt-btn{display:block;width:100%;text-align:left;font:inherit;font-size:.95rem;padding:12px 16px;border:2px solid var(--bord);background:#fff;border-radius:10px;cursor:pointer;transition:all .15s;margin:6px 0}
.opt-btn:hover{background:var(--bleuf);border-color:var(--bleu2)}
.opt-btn.selected{border-color:var(--bleu2);background:var(--bleuf);font-weight:bold;box-shadow:inset 0 0 0 2px #d3e6f9}
.opt-btn.selected::before{content:"☑ "}
.opt-btn.correct{border-color:var(--vert);background:var(--vertF);font-weight:bold}
.opt-btn.wrong{border-color:var(--rouge);background:var(--rougeF)}
.opt-btn.manque{border-color:var(--orange);background:var(--orangeF)}
.opt-btn.correct::before{content:"✔ "}
.opt-btn.wrong::before{content:"✘ "}
.opt-btn.manque::before{content:"🔸 "}
.opt-btn:disabled{cursor:default;color:var(--noir)}
.opt-btn.correct:disabled{color:#1e5b23}
.opt-btn.wrong:disabled{color:#7f1d1d}
.compteur-choix{font-weight:bold;color:var(--bleu2)}
.score-display{font-size:1.3rem;font-weight:bold;color:var(--bleu);text-align:center;padding:12px;background:var(--bleuf);border-radius:10px;margin:12px 0}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.match-item{padding:10px 14px;border:2px solid var(--bord);border-radius:10px;cursor:pointer;background:#fff;font-size:.9rem;transition:all .15s;margin-bottom:6px}
.match-item:hover{border-color:var(--bleu2);background:var(--bleuf)}
.match-item.selected{border-color:var(--bleu2);background:var(--bleuf);font-weight:bold}
.match-item.matched{border-color:var(--vert);background:var(--vertF);cursor:default;opacity:.7}
.flow-step{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1px solid var(--bord);border-radius:10px;margin:8px 0}
.flow-icon{font-size:2rem;flex-shrink:0}
.flow-content h4{margin:0 0 4px;color:var(--bleu)}.flow-content p{margin:0;font-size:.9rem;color:var(--gris)}
.flow-arrow{text-align:center;color:var(--bleu2);font-size:1.5rem;margin:4px 0}
footer{text-align:center;padding:20px;color:var(--gris);font-size:.8rem}
@media(max-width:600px){.match-grid{grid-template-columns:1fr}.tabs button{font-size:.78rem;padding:6px 10px}}

/* =====================================================================
   AJOUT — MODULES N2 « VPN » ET N3b « CHIFFREMENT »
   ===================================================================== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid-2{grid-template-columns:1fr}}
.mini-card{background:#fff;border:1px solid var(--bord);border-radius:10px;padding:10px 12px}
.mini-card h4{margin:0 0 6px;color:var(--bleu);font-size:.98rem}
.mini-card p{font-size:.9rem}
.mini-card ul{margin:4px 0 4px 18px}
.mini-card li{font-size:.9rem;margin:4px 0}
.tunnel{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;
  background:#f7fbff;border:2px dashed var(--bleu2);border-radius:10px;padding:10px;margin:10px 0}
.tunnel .etape{font-size:.8rem;text-align:center;flex:1 1 100px;line-height:1.25}
.tunnel .etape b{display:block;font-size:1.7rem;font-weight:normal}
.tunnel .etape.voyant{color:var(--rouge)}
table.compare{width:100%;border-collapse:collapse;font-size:.86rem;margin:8px 0}
table.compare th,table.compare td{border:1px solid var(--bord);padding:6px 8px;vertical-align:top}
table.compare th{background:var(--bleuf);color:var(--bleu)}
table.compare td.tete{background:#f7fbff;font-weight:bold;color:var(--bleu);width:26%}
.tab-cesar{width:100%;border-collapse:collapse;font-size:.7rem;text-align:center;margin:8px 0;table-layout:fixed}
.tab-cesar th,.tab-cesar td{border:1px solid var(--bord);padding:3px 0}
.tab-cesar th{background:var(--bleuf);color:var(--bleu)}
.tab-cesar td{background:#fff;font-weight:bold}
.coffre{border:3px solid var(--bleu);border-radius:12px;padding:14px;background:var(--bleuf);
  font-family:"Courier New",monospace;font-size:1.05rem;text-align:center;margin:10px 0;word-break:break-word}
.coffre.ferme{background:#e9eef4;border-color:var(--gris);letter-spacing:.14em;color:#3d4a57}
.cle-badge{display:inline-block;font-size:.72rem;font-weight:bold;text-transform:uppercase;letter-spacing:.04em;
  border-radius:999px;padding:3px 10px;margin:0 4px 4px 0}
.cle-pub{background:#dbeafe;color:#1e40af}.cle-priv{background:#fef3c7;color:#92400e}
.mono{font-family:"Courier New",monospace;background:#eef2f7;border-radius:6px;padding:1px 6px;letter-spacing:.06em}
.champ-court{font:inherit;font-size:.95rem;padding:8px 10px;border:2px solid var(--bord);border-radius:8px;
  width:100%;max-width:340px;font-family:"Courier New",monospace;letter-spacing:.06em;text-transform:uppercase}
.champ-court:focus{outline:3px solid #cfe3f7;border-color:var(--bleu2)}
.champ-court.champ-ok{border-color:var(--vert);background:var(--vertF)}
.champ-court.champ-ko{border-color:var(--rouge);background:var(--rougeF)}
.note-type{font-size:.84rem;color:var(--gris);margin:4px 0}
#cesar-table{max-width:100%;overflow-x:auto}
@media(max-width:520px){.tab-cesar{font-size:.58rem}.tab-cesar th,.tab-cesar td{padding:2px 0;border-width:1px}}
.etape-cle{margin:8px 0;padding:0}
.etape-cle .btn{margin-bottom:6px}
input[type=range]{width:100%;max-width:420px;accent-color:var(--bleu2)}
.essai-cesar{font-family:"Courier New",monospace;letter-spacing:.06em;background:var(--bleuf);
  border-radius:8px;padding:8px 10px;margin:6px 0;display:inline-block}
@media screen{.etape-non-faite{display:none !important}}
@media print{.etape-non-faite{display:block !important;color:#999;font-style:italic;font-size:.9rem}}

/* =====================================================================
   SCÈNES ANIMÉES DE L'ONGLET BONUS — le message voyage d'un personnage
   à l'autre (durée réglable par la constante DUREE_VOYAGE du script)
   ===================================================================== */
.scene-titre{font-weight:bold;color:var(--bleu);margin:6px 0 4px}
.scene{position:relative;height:250px;margin:8px 0;border:1px solid var(--bord);border-radius:12px;overflow:hidden;background:linear-gradient(#f9fcff,#e7f1fb)}
.scene .perso{position:absolute;top:25%;width:80px;margin-left:-40px;text-align:center;font-size:.76rem;font-weight:bold;color:var(--bleu);line-height:1.1}
.scene .perso b{display:block;font-size:1.9rem;font-weight:normal}
.scene .espion{position:absolute;left:50%;top:3%;transform:translateX(-50%);text-align:center;font-size:.76rem;font-weight:bold;color:var(--rouge)}
.scene .espion b{display:block;font-size:1.5rem;font-weight:normal}
.scene .copie{position:absolute;left:50%;top:20%;transform:translateX(-50%);max-width:200px;text-align:center;font-size:.72rem;color:var(--rouge);background:var(--rougeF);border:1px solid var(--rouge);border-radius:8px;padding:3px 8px;opacity:0;transition:opacity .35s}
.scene .copie.visible{opacity:1}
.scene .privee{position:absolute;right:5px;top:3%;text-align:center;font-size:.7rem;font-weight:bold;color:#8a4b04;background:var(--orangeF);border:1px solid var(--orange);border-radius:8px;padding:3px 7px;line-height:1.2}
.scene .privee span{display:block;font-weight:normal;font-size:.64rem;color:var(--gris)}
.scene .route{position:absolute;left:16%;right:16%;top:68%;border-top:3px dashed var(--bleu2);opacity:.5}
.scene .route-label{position:absolute;left:0;top:86%;width:100%;text-align:center;font-size:.68rem;color:var(--gris)}
.paquet{position:absolute;top:50%;left:16%;transform:translateX(-50%);width:132px;padding:5px 6px;border:2px solid var(--bleu2);border-radius:8px;background:#fff;text-align:center;font-family:"Courier New",monospace;font-size:.68rem;line-height:1.2;box-shadow:0 2px 6px rgba(31,78,121,.15);word-break:break-word}
.paquet.chiffre{background:#e9eef4;border-color:var(--gris);color:#3d4a57;letter-spacing:.08em}
.paquet.ouvert{background:var(--vertF);border-color:var(--vert);color:#1e5b23;font-weight:bold}
.paquet.objet{top:71%;width:118px;border-color:var(--orange);background:var(--orangeF);color:#8a4b04;font-size:.66rem;font-weight:bold;box-shadow:none}
.scene-cmd{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
.scene-cmd .btn{font-size:.9rem;padding:8px 14px}
.compteur{font-size:.82rem;color:var(--gris);font-weight:bold}
.points{margin:2px 0 6px}
.points span{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--bord);margin:0 3px}
.points span.on{background:var(--bleu2)}
/* le déroulé des étapes : l'étape en cours est surlignée, la liste sert aussi de trace imprimée */
.scene-print{margin-top:4px;font-size:.88rem}
.scene-print strong{color:var(--bleu)}
.scene-print ol{margin:4px 0 0 20px}
.scene-print li{margin:3px 0;color:#5b6b7b}
.scene-print li{cursor:pointer}
.scene-print li:hover{background:#eef5fd}
@media print{.scene-print li{cursor:auto}.scene-print li:hover{background:none}}
.scene-print li.etape-active{color:var(--noir);font-weight:bold;background:var(--bleuf);
  border-left:4px solid var(--bleu2);border-radius:5px;padding:3px 8px;list-style-position:inside;margin-left:-20px}
@media print{
  .scene,.scene-cmd,.points{display:none !important}
  .scene-print{display:block !important;font-size:.9rem}
}
@media(max-width:520px){
  .scene{height:292px}
  .paquet{width:96px;font-size:.6rem;padding:4px}
  .scene .perso{width:62px;margin-left:-31px}
  .scene .copie{max-width:148px;font-size:.66rem}
}

/* =====================================================================
   AJOUT — RESSOURCES N1 (fiches de connaissances, vidéos, quiz) & EXPORT PDF
   ===================================================================== */
.ressources-n1{margin:16px 0 6px;padding:12px 14px;background:#f7fbff;
  border:1px solid var(--bord,#c9d6e4);border-left:5px solid var(--bleu,#1f4e79);border-radius:10px}
.ressources-n1 > h3{margin:0 0 6px;color:var(--bleu,#1f4e79);font-size:1rem}
.ressources-n1 .note{font-size:.82rem;color:var(--gris,#5b6b7b);margin:.35rem 0}
.ress-carte{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;
  background:#fff;border:1px solid #dbe6f2;border-radius:8px;padding:8px 10px;margin:6px 0}
.ress-code-titre{font-size:.9rem;flex:1 1 320px;line-height:1.35}
.ress-code{display:inline-block;font-weight:bold;font-size:.78rem;letter-spacing:.03em;
  background:#dce9f7;color:var(--bleu,#1f4e79);border-radius:4px;padding:2px 7px;margin-right:6px}
.ress-liens{display:flex;flex-wrap:wrap;gap:6px}
a.ress-lien{font-size:.8rem;text-decoration:none;border-radius:999px;padding:4px 10px;border:1px solid;white-space:nowrap}
a.ress-lien.fiche{background:#fdf0dd;border-color:#d97706;color:#8a4b04}
a.ress-lien.video{background:#f3e5f5;border-color:#6a1b9a;color:#5c1487}
a.ress-lien.quiz{background:#e6f4e7;border-color:#2e7d32;color:#1e5b23}
a.ress-lien.form{background:#eef1fa;border-color:#3b4b8a;color:#2b3768}
.carte-export-pdf{margin:16px 0 6px;padding:14px;background:#fff;border:1px solid var(--bord,#c9d6e4);
  border-left:5px solid var(--vert,#2e7d32);border-radius:10px}
.carte-export-pdf h3{margin:0 0 4px;color:var(--vert,#2e7d32)}
.bouton-export-pdf{font:inherit;font-size:1rem;font-weight:bold;padding:12px 18px;margin-top:8px;
  border:none;border-radius:10px;background:var(--vert,#2e7d32);color:#fff;cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.15)}
.bouton-export-pdf:hover{background:#256428}
#entete-export-pdf{display:none}
.ep-titre{font-size:1.25rem;font-weight:bold;color:#1f4e79}
.ep-sous{font-size:.85rem;color:#5b6b7b;margin:2px 0 6px}
.ep-legende{font-size:.78rem;color:#333;border:1px dashed #8a9bb0;border-radius:6px;
  padding:5px 7px;margin:4px 0 6px}
table.ep-infos{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:6px}
table.ep-infos td{border:1px solid #8a9bb0;padding:4px 6px;vertical-align:top}
.ep-reponse{border:1px solid #99a;border-radius:4px;padding:4px 6px;margin:4px 0;
  white-space:pre-wrap;min-height:1.1em;font-size:.95em;background:#fbfcfe}
.ep-vide{color:#999;font-style:italic}
@media screen{.ajout-export{display:none !important}}
@media print{
  @page{size:A4;margin:12mm 10mm}
  html,body{background:#fff !important;font-size:10.5pt !important;color:#000 !important}
  header,footer,nav,nav.tabs,.onglets,.tabs,.boutons,.barre-progression,#zone-message,
  .no-print,.bouton-export-pdf,.print-btn{display:none !important}
  main{padding:0 !important;margin:0 !important;max-width:none !important;width:auto !important}
  section,.tab-content{display:block !important;page-break-before:always;break-before:page;
    opacity:1 !important;transform:none !important;animation:none !important}
  section:first-of-type,.tab-content:first-of-type{page-break-before:auto;break-before:auto}
  section *, .tab-content *{animation:none !important;transition:none !important}
  section .carte, section .card, section .quiz-question, section .mesure, .tab-content > div{
    opacity:1 !important;visibility:visible !important}
  #entete-export-pdf{display:block !important;margin:0 0 8mm 0}
  .ajout-export{display:block !important}
  .masque-impression{display:none !important}
  .quiz-feedback{display:block !important}
  .carte,.card,.quiz-question,.mesure,.bilan-defi,.carte-export-pdf,.ressources-n1,.ress-carte{
    page-break-inside:avoid;break-inside:avoid}
  a{color:#000 !important;text-decoration:none}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:7.5pt;color:#444;word-break:break-all}
  /* marqueurs de réponse : on voit d'un coup d'œil ce que l'élève a choisi */
  .correct-answer::before,.correct-choice::before,.opt-btn.correct::before,
  .match-item.matched::before,.assoc-item.matched::before,.etiquette-drop.correct::before,
  .tag-selectable.selected::before,.filled::before,.placed::before,.placed-ok::before,
  .quiz-option.selected::before{content:"✔ "}
  .wrong-answer::before,.wrong-choice::before,.opt-btn.wrong::before,.placed-ko::before,
  .incorrect::before{content:"✘ "}
  .quiz-question.correct > p.enonce::before{content:"✔ "}
  .quiz-question.incorrect > p.enonce::before{content:"✘ "}
  .ress-carte{border:none;padding:2px 0;margin:2px 0}
  .ressources-n1{background:#fff;padding:6px 8px}
  .ressources-n1 a[href^="http"]::after{font-size:7pt}
}

/* =====================================================================
   ADAPTATION TELEPHONE (correctifs mobiles)
   Voir Rapport-compatibilite-mobile-apps.md
   - la barre du haut se replie au defilement : seuls les onglets restent
   - onglets sur une seule ligne, defilement horizontal au doigt
   - champs a 16 px : supprime le zoom automatique d'iOS
   - cibles tactiles des QCM et des etiquettes portees a 44 px
   La condition vise les ecrans etroits ET les ecrans peu hauts (telephone
   en paysage). Le prefixe « screen » protege l'impression et l'export PDF.
   ===================================================================== */
@media screen and (max-width: 700px), screen and (max-height: 500px) {

  /* --- En-tete plus compact --- */
  header{padding:8px 10px 6px}
  header h1{font-size:.95rem; line-height:1.15}
  header h1 small{display:block; font-size:.68rem}
  header .bloc-binome, header .header-fields, header .meta{gap:6px; font-size:.78rem}
  header .barre-progression{display:none}

  /* --- Barre d'onglets : une seule ligne, defilement horizontal --- */
  header .onglets, header .tabs, header .tabs-nav, nav.tabs, header + nav, body > nav{
    flex-wrap:nowrap !important;
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    gap:6px;
  }
  header .onglets button, header .tabs button, header .tabs-nav button,
  nav.tabs button, header + nav button, body > nav button{
    flex:0 0 auto; white-space:nowrap; font-size:.76rem; padding:7px 11px;
  }

  /* --- Champs de saisie : 16 px = pas de zoom automatique sur iOS --- */
  input, textarea, select{font-size:16px !important}

  /* --- Reponses de QCM : la ligne entiere devient une cible confortable --- */
  /* min-height est ignore sur un <label> reste en display:inline : on force
     donc un affichage qui tient compte de la hauteur (inline-flex centre le
     texte verticalement et laisse la ligne se poursuivre comme avant). */
  label:has(input[type="radio"]), label:has(input[type="checkbox"]){
    display:inline-flex; align-items:center;
    min-height:44px; min-width:44px; box-sizing:border-box}
  label.option-choix, label.quiz-option, .opt-btn{min-height:44px}
  input[type="radio"], input[type="checkbox"]{width:22px; height:22px; flex:0 0 auto}

  /* --- Etiquettes a deplacer --- */
  .etiquette, .assoc-item, .etiquette-drop, .chip{min-height:44px; box-sizing:border-box}
  .etiquette, .assoc-item, .chip{display:inline-flex; align-items:center}
  .etiquette-drop{display:flex; align-items:center}

  /* --- Repere visuel de l'etiquette selectionnee au doigt --- */
  .etiquette.selectionnee, .assoc-item.selectionnee, .chip.selectionnee{
    outline:3px solid #ef6c00; background:#fff3e0; border-color:#ef6c00}
}
</style>
</head>
<body>

<!-- Correctifs telephone : barre repliable, onglets sur une ligne, retour en
     haut au changement de niveau, compensation des sauts d'ancre.
     Voir Rapport-compatibilite-mobile-apps.md
     Ce script est place juste apres <body> : il attend que le DOM soit
     construit avant de mesurer quoi que ce soit. -->
<script>
(function () {
  // Conteneurs d'onglets possibles, selon la structure de l'app.
  var SELECTEUR_ONGLETS =
    'header .onglets, header .tabs, header .tabs-nav, nav.tabs, header + nav, body > nav';

  function trouverOnglets() {
    var liste = document.querySelectorAll(SELECTEUR_ONGLETS);
    for (var i = 0; i < liste.length; i++) {
      if (liste[i].querySelector('button')) return liste[i];
    }
    return null;
  }

  function ajuster() {
    var entete = document.querySelector('header');
    var onglets = trouverOnglets();
    if (!entete || !onglets) return;
    var petit = window.matchMedia('(max-width: 700px), (max-height: 500px)').matches;

    if (!petit) {
      // Ordinateur : on rend la main au CSS d'origine.
      entete.style.top = '0px';
      onglets.style.position = '';
      onglets.style.top = '';
      document.documentElement.style.scrollPaddingTop =
        (entete.offsetHeight + 8) + 'px';
      return;
    }

    if (entete.contains(onglets)) {
      // Onglets DANS l'en-tete : on replie l'en-tete jusqu'aux onglets.
      // Le titre et les champs binome/classe sortent de l'ecran au
      // defilement, les onglets restent sous les yeux.
      var hautEntete = entete.getBoundingClientRect().top + window.scrollY;
      var hautOnglets = onglets.getBoundingClientRect().top + window.scrollY;
      var dessus = Math.max(0, Math.round(hautOnglets - hautEntete));
      entete.style.top = (-dessus) + 'px';
    } else {
      // Onglets HORS de l'en-tete : l'en-tete disparait entierement au
      // defilement et la barre d'onglets se colle en haut de l'ecran.
      entete.style.top = (-entete.offsetHeight) + 'px';
      onglets.style.position = 'sticky';
      onglets.style.top = '0px';
      var fond = getComputedStyle(onglets).backgroundColor;
      if (!fond || fond === 'rgba(0, 0, 0, 0)' || fond === 'transparent') {
        onglets.style.background = '#fff';
      }
      if (getComputedStyle(onglets).zIndex === 'auto') onglets.style.zIndex = '30';
    }

    // Les sauts d'ancre et les scrollIntoView ne passent plus sous la barre.
    var hauteurBarre = Math.round(onglets.getBoundingClientRect().height);
    document.documentElement.style.scrollPaddingTop = (hauteurBarre + 8) + 'px';
  }

  // Retour en haut au changement de niveau. Ecouteur delegue : il fonctionne
  // quelle que soit la mecanique propre a l'app (data-tab, switchTab, onclick).
  function retourEnHaut(e) {
    var cible = e.target;
    if (!cible || !cible.closest) return;
    var bouton = cible.closest('button');
    if (!bouton || !bouton.closest(SELECTEUR_ONGLETS)) return;
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function demarrer() {
    ajuster();
    document.addEventListener('click', retourEnHaut, true);
    window.addEventListener('resize', ajuster);
    window.addEventListener('orientationchange', ajuster);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajuster);
    window.setTimeout(ajuster, 300);   // apres application des styles et des polices
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', demarrer);
  } else {
    demarrer();
  }
  window.addEventListener('load', demarrer);
})();
</script>

   Version allégée : deux animations d'explication (3 s par voyage),
   un seul exercice manipulable et UN SEUL quiz de 3 questions.

const A26="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const MSG_CLAIR="LE CODE EST 4217";
const MSG_INTERCEPTE="PHVVDJH VHFUHW";
const DUREE_VOYAGE=3000;   /* durée d'un déplacement, paramètre interne jamais affiché à l'élève */

function norm(s){return (s||"").toUpperCase().replace(/\s+/g," ").trim();}
function cesar(texte,k){
 k=((k%26)+26)%26;
 let out="";
 for(const c of texte.toUpperCase()){
  const i=A26.indexOf(c);
  out+=(i<0)?c:A26[(i+k)%26];
 }
 return out;
}
function tableCesar(k){
 k=((k%26)+26)%26;
 let h1="",h2="";
 for(let i=0;i<26;i++){h1+="<th>"+A26[i]+"</th>";h2+="<td>"+A26[(i+k)%26]+"</td>";}
 return '<table class="tab-cesar"><tr>'+h1+'</tr><tr>'+h2+'</tr></table>';
}

/* ---- affiche l'état d'une étape ---- */
function appliquerScene(id,i){
 const S=SCENES[id],st=S.steps[i];
 const sc=document.getElementById("scene-"+id);
 if(!S||!st||!sc)return;
 S.i=i;
 const p=document.getElementById("paquet-"+id);
 const o=document.getElementById("objet-"+id);
 const cp=document.getElementById("copie-"+id);
 const pv=document.getElementById("privee-"+id);
 if(st.p){
  p.style.transition=st.p.voyage?"left "+DUREE_VOYAGE+"ms linear":"none";
  p.style.left=st.p.pos+"%";
  p.innerHTML=st.p.msg;
  p.className="paquet"+(st.p.etat==="chiffre"?" chiffre":(st.p.etat==="ouvert"?" ouvert":""));
 }
 if(st.o){
  if(st.o.premier){o.style.transition="none";o.style.left=st.o.pos+"%";void o.offsetWidth;}
  o.style.display="block";
  o.style.transition=st.o.voyage?"left "+DUREE_VOYAGE+"ms linear":"none";
  o.style.left=st.o.pos+"%";
  if(st.o.label)o.innerHTML=st.o.label;
 }
 if(pv)pv.style.display=st.privee?"block":"none";
 if(cp){cp.innerHTML=st.copie||"";cp.classList.toggle("visible",!!st.copie);}
 document.getElementById("compteur-"+id).textContent="Étape "+(i+1)+" / "+S.steps.length;
 const pts=document.querySelectorAll("#points-"+id+" span");
 for(let k=0;k<pts.length;k++)pts[k].className=(k<=i)?"on":"";
 for(let k=0;k<S.steps.length;k++){
  const li=document.getElementById("li-"+id+"-"+k);
  if(li)li.className=(k===i)?"etape-active":"";
 }
}

/* ---- lecteur : lecture automatique + bouton unique « Recommencer » ---- */
function arreterScene(id){
 const S=SCENES[id];
 if(S.timer){clearTimeout(S.timer);S.timer=null;}
}
function lancerScene(id){
 const S=SCENES[id];
 arreterScene(id);
 const suivant=()=>{
  if(S.i>=S.steps.length-1){S.timer=null;return;}
  appliquerScene(id,S.i+1);
  S.timer=setTimeout(suivant,S.steps[S.i].ms);
 };
 S.timer=setTimeout(suivant,S.steps[S.i].ms);
}
window.sceneReset=function(id){
 appliquerScene(id,0);
 lancerScene(id);
};
/* cliquer une étape du déroulé met l'animation en pause sur cette étape */
window.sceneGo=function(id,i){
 arreterScene(id);
 appliquerScene(id,i);
};

 h+='<p style="margin-top:8px"><strong>Ma réponse à la problématique :</strong> en deux ou trois phrases, explique pourquoi le chiffrement à deux clés résout le problème du chiffrement à une seule clé.</p>';

 h+='<p><strong>KeePass</strong> est un logiciel <strong>libre et gratuit</strong> : il sert à <strong>conserver</strong> ses mots de passe en sécurité, et aussi à en <strong>transmettre</strong> — on envoie alors le fichier chiffré par un canal et le mot de passe principal par un autre, <strong>jamais les deux ensemble</strong>.</p>';
 h+='<div class="info error"><strong>⚠️ Trois règles à ne pas oublier :</strong> le mot de passe principal ne se note <strong>jamais</strong> à côté du fichier ; le fichier ne se dépose pas dans un espace partagé ; et un tel coffre ne sert à rien si le mot de passe qui l\'ouvre est « 123456 ». À l\'école, on n\'installe rien : on en parle, et on regarde les gestionnaires déjà intégrés aux navigateurs.</div>';
 h+='<p class="note-type">🔗 Sites officiels : <a href="https://keepass.info/" target="_blank" rel="noopener">keepass.info</a> (Windows) · <a href="https://keepassxc.org/" target="_blank" rel="noopener">keepassxc.org</a> (Windows, macOS, Linux). Pour aller plus loin : <a href="https://cnil.fr/sites/cnil/files/atoms/files/deliberation-2022-100-du-21-juillet-2022_recommandation-aux-mots-de-passe.pdf" target="_blank" rel="noopener">recommandation de la CNIL sur les mots de passe</a>.</p>';
 h+='</div>';
 return h;
}

  :"❌ <strong>Il reste des erreurs.</strong> Reprends lettre par lettre avec la table : chaque lettre est remplacée par celle située <b>"+k+"</b> rang(s) plus loin dans l'alphabet. Résultat attendu : <span class=\"mono\">"+attendu+"</span>";

  :"❌ Ce n'est pas la bonne clé. Cherche le décalage qui fait apparaître des mots français compréhensibles (deux mots, le premier commence par M…). <em>Indice : la clé est inférieure à 5.</em>";

["Signaler le compte à la plateforme Instagram","Faire des captures d\'écran comme preuves","En parler à un adulte de confiance (parent, professeur)","Porter plainte auprès de la police si nécessaire","Répondre aux messages insultants pour se défendre"].forEach((a,j)=>{

[
{text:"L'adresse email de l'expéditeur ne correspond pas au domaine officiel du collège",valid:true},

].forEach((c,j)=>{

});

window.checkInv=function(si,oi){
if(invDone[si]!==undefined)return;invDone[si]=oi;
const fb=document.getElementById("inv-fb-"+si);
document.querySelectorAll('[data-s="0"]').forEach(b=>b.disabled=true);
if(oi===4){
document.querySelector('[data-s="0"][data-o="4"]').classList.add("correct");
fb.className="info success";fb.innerHTML="✅ <strong>Exact !</strong> Il ne faut JAMAIS répondre à la cyberviolence. Cela aggrave la situation et donne du contenu supplémentaire au harceleur. Les autres actions sont toutes recommandées.";
}else{
document.querySelector('[data-s="0"][data-o="'+oi+'"]').classList.add("wrong");
fb.className="info error";fb.innerHTML="❌ Cette action est au contraire recommandée. Cherchez celle qui est déconseillée.";
}
fb.style.display="block";
};

window.clueSelected=new Set();
window.toggleClue=function(btn,j){
btn.classList.toggle("selected");
if(clueSelected.has(j))clueSelected.delete(j);else clueSelected.add(j);
const c=document.getElementById("clue-compteur");
if(c)c.textContent=clueSelected.size;
};

window.checkClues=function(){
const fb=document.getElementById("clue-fb");
const clues=[true,true,true,true,false];
let correct=0,total=4;
clues.forEach((valid,j)=>{
const btn=document.querySelector('[data-s="1"][data-c="'+j+'"]');
if(valid&&clueSelected.has(j)){btn.classList.add("correct");correct++;}
else if(!valid&&clueSelected.has(j)){btn.classList.add("wrong");}
else if(valid&&!clueSelected.has(j)){btn.style.borderColor="var(--orange)";}
btn.disabled=true;
});
fb.className="info "+(correct===total?"success":"");
fb.innerHTML="<strong>"+correct+" / "+total+"</strong> indices trouvés. "+(correct===total?"🎉 Bravo, vous avez l'œil !":"Les indices manquants sont surlignés en orange. Le logo seul n'est PAS un indice fiable car il est facilement copié.");
fb.style.display="block";
};

/* =====================================================================
   MOTEUR DE QUIZ COMMUN (VPN et onglet bonus)
   Une seule mise en œuvre pour les 2 questionnaires :
   correction immédiate + score affiché en bas du questionnaire.
   ===================================================================== */
const QUIZZES={
 vpn:[
  {q:"Que voit encore ton fournisseur d'accès (ou l'administrateur du réseau du collège) quand tu utilises un VPN ?",
   opts:["Le détail des sites visités et le contenu des pages",
         "Uniquement que tu te connectes à un serveur VPN, et le volume de données échangé",
         "Absolument rien : il ne voit même plus que tu es connecté à Internet"],
   ok:1,
   fb:"Le VPN cache <b>où tu vas</b> et <b>ce que tu dis</b>, mais pas le fait que tu passes par un VPN ni la quantité de données. C'est déjà un gros changement : la destination et le contenu redeviennent privés."},
  {q:"« Avec un VPN, je fais confiance à son éditeur à la place de mon fournisseur d'accès. »",
   opts:["Vrai : le VPN déplace la confiance, il ne la supprime pas",
         "Faux : un VPN anonymise toujours totalement",
         "Faux : un VPN ne voit jamais passer les données"],
   ok:0,
   fb:"Le VPN est un <b>intermédiaire</b> : tout ton trafic passe par lui. S'il est honnête, ta vie privée progresse ; s'il est malveillant, il voit exactement ce que ton fournisseur d'accès voyait… mais sans aucun contrôle de ta part."},
  {q:"Parmi ces éléments, lequel un VPN ne protège PAS ?",
   opts:["Les informations personnelles que tu écris volontairement dans un chatbot (nom, adresse, photos)",
         "Les données qui circulent sur un Wi-Fi public mal sécurisé",
         "Ton adresse IP réelle vis-à-vis des sites que tu consultes"],
   ok:0,
   fb:"Le VPN chiffre le <b>transport</b>. Il ne contrôle pas ce que tu écris à une IAG, ni les cookies et les comptes connectés (si tu es connecté à ton compte, le site te reconnaît malgré le VPN)."},
  {q:"Un VPN gratuit peut-il lire des identifiants ou revendre des données ?",
   opts:["Non : « gratuit » signifie forcément « sans exploitation des données »",
         "Oui : le trafic non chiffré de bout en bout passe par lui, gratuit ou payant",
         "Non : un VPN ne peut pas conserver de journaux de connexion"],
   ok:1,
   fb:"La bonne question n'est pas « gratuit ou payant », mais <b>« qui édite cet outil, et comment gagne-t-il de l'argent ? »</b>. Un service gratuit sans modèle économique clair doit être observé avec méfiance."},
  {q:"Au collège, utiliser un VPN pour contourner le filtrage du réseau de l'établissement…",
   opts:["est autorisé, car c'est un usage strictement personnel",
         "est interdit par le règlement intérieur et peut entraîner des sanctions",
         "permet de naviguer plus vite, donc c'est encouragé"],
   ok:1,
   fb:"Le filtrage de l'établissement protège les élèves (contenus illicites, jeux, réseaux sociaux). Le contourner est un manquement au règlement intérieur — et le VPN ne rend jamais anonyme face à une enquête légale."}
 ],
 chiffrement:[
  {q:"Message chiffré envoyé à Bob (asymétrique) : avec quelle clé a-t-il été chiffré ?",
   opts:["Avec la clé privée de Bob","Avec la clé publique de Bob","Avec la clé publique de l'expéditeur"],
   ok:1,
   fb:"On chiffre toujours avec la clé <b>publique du destinataire</b> (le cadenas que tout le monde possède). Seul Bob peut ouvrir, avec sa clé privée, qui ne circule jamais."},
  {q:"Pourquoi le code de César est-il facile à casser ?",
   opts:["Parce qu'il n'existe que 25 décalages possibles : on peut les essayer tous",
         "Parce que les chiffres du message ne sont pas transformés",
         "Parce que sa clé est trop longue à retenir"],
   ok:0,
   fb:"25 essais suffisent quelques minutes à la main (et une fraction de seconde à un ordinateur) : c'est la <b>force brute</b>. Le chiffrement moderne (AES, RSA) utilise des clés de 128 à 2048 bits : un nombre de possibilités astronomique (plus de 10³⁸ pour 128 bits)."},
  {q:"Que signifie le cadenas 🔒 affiché dans la barre d'adresse du navigateur ?",
   opts:["Le site est forcément honnête et fiable",
         "La connexion est chiffrée en HTTPS : personne sur le trajet ne peut lire l'échange",
         "Le site a installé un VPN sur ton ordinateur"],
   ok:1,
   fb:"HTTPS chiffre le <b>transport</b>. Il empêche l'espionnage en route, mais ne dit rien de l'honnêteté du site : un faux site de phishing peut, lui aussi, afficher un cadenas."}
 ]
};
const QSTATE={};

function renderQuiz(key,titre,intro){
 const list=QUIZZES[key];
 if(!QSTATE[key])QSTATE[key]={a:0,c:0,t:list.length};
 let h='<div class="card"><h3>'+titre+'</h3>';
 if(intro)h+='<p>'+intro+'</p>';
 list.forEach((it,qi)=>{
  h+='<p class="enonce" style="font-weight:bold;margin-top:10px">'+(qi+1)+'. '+it.q+'</p>';
  it.opts.forEach((o,oi)=>{
   h+='<button class="opt-btn quiz-option" data-qk="'+key+'" data-qi="'+qi+'" data-oi="'+oi+'" onclick="mcqAnswer(\''+key+'\','+qi+','+oi+')">'+o+'</button>';
  });
  h+='<div id="q-'+key+'-'+qi+'" style="display:none;margin-top:6px;padding:10px;border-radius:8px;font-size:.9rem"></div>';
 });
 h+='<div class="score-display" id="score-'+key+'" style="display:none"></div></div>';
 return h;
}

window.mcqAnswer=function(key,qi,oi){
 const it=QUIZZES[key][qi],st=QSTATE[key];
 if(typeof it.done==="boolean"&&it.done)return;
 it.done=true;
 const btns=document.querySelectorAll('[data-qk="'+key+'"][data-qi="'+qi+'"]');
 btns.forEach(b=>{
  const j=parseInt(b.getAttribute("data-oi"),10);
  b.disabled=true;
  if(j===it.ok)b.classList.add("correct");
  else if(j===oi)b.classList.add("wrong");
 });
 const fb=document.getElementById("q-"+key+"-"+qi);
 fb.className="info "+(oi===it.ok?"success":"error");
 fb.innerHTML=(oi===it.ok?"✅ <strong>Exact !</strong> ":"❌ <strong>Ce n'est pas la bonne réponse.</strong> ")+it.fb;
 fb.style.display="block";
 st.a++; if(oi===it.ok)st.c++;
 if(st.a===st.t){
  const s=document.getElementById("score-"+key);
  s.style.display="block";
  s.innerHTML="Score : "+st.c+" / "+st.t+(st.c===st.t?" 🎉 Bravo, tout est juste !":" — reprends les questions manquées avec ton professeur.");
 }
};

init();

</script>

<!-- ===== Module d'export PDF : impression du support complet avec les réponses ===== -->
<script>
(function(){
'use strict';
var NIVEAU = "4e";
var ID = 'entete-export-pdf';

function val(selecteurs){
  for (var i=0;i<selecteurs.length;i++){
    var e = document.querySelector(selecteurs[i]);
    if (e && e.value && e.value.replace(/\s+/g,'')) return e.value.trim();
  }
  return '';
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function estCible(e){
  if (!e || e.disabled) return false;
  if (e.type === 'password' || e.type === 'number' || e.type === 'hidden') return false;
  if (e.id === 'binome' || e.id === 'classe' || e.id === 'nom') return false;
  if (e.closest && e.closest('header')) return false;   // champs binôme / classe (imprimés dans l'en-tête)
  if (e.tagName === 'TEXTAREA' || e.tagName === 'INPUT') return true;
  return false;
}
function entete(){
  var z = document.getElementById(ID);
  if (!z){
    z = document.createElement('div');
    z.id = ID;
    document.body.insertBefore(z, document.body.firstChild);
  }
  var titre = document.title || 'Activité de technologie';
  var h1 = document.querySelector('h1');
  if (h1){
    var copie = h1.cloneNode(true);
    var sm = copie.querySelector('small');
    if (sm && sm.parentNode) sm.parentNode.removeChild(sm);
    var t = (copie.textContent || '').replace(/\s+/g,' ').trim();
    if (t) titre = t;
  }
  var eleve = val(['#binome','#nom','#eleve','#nom-eleve','.bloc-binome input[type=text]',
                   'header input[type=text][placeholder*="nom"]',
                   'header input[type=text][placeholder*="Prenom"]',
                   'header input[type=text]']);
  var classe = val(['#classe','input[type=text][placeholder*="Classe"]',
                    'input[type=text][placeholder*="classe"]',
                    'input[type=text][placeholder*="5e"]','input[type=text][placeholder*="4e"]',
                    'input[type=text][placeholder*="3e"]']);
  var d = new Date();
  var quand = d.toLocaleDateString('fr-FR') + ' ' +
              d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  z.innerHTML = '<div class="ep-titre">' + esc(titre) + '</div>' +
    '<div class="ep-sous">Technologie — cycle 4 — niveau ' + esc(NIVEAU) +
    " · Support d'activité imprimé avec les réponses de l'élève</div>" +
    '<table class="ep-infos"><tr>' +
    '<td><b>Binôme / élève :</b> ' + esc(eleve || '…………………………') + '</td>' +
    '<td><b>Classe :</b> ' + esc(classe || '…………') + '</td>' +
    '<td><b>Date :</b> ' + esc(quand) + '</td>' +
    '</tr></table>' +
    '<div class="ep-legende">Repères de lecture : fond <b>vert</b> = réponse réussie ; fond <b>rouge</b> = réponse erronée ;' +
    ' encadré = réponse écrite saisie par l’élève ; « — non répondu — » = question non traitée.</div>';
}
function nettoyer(){
  var a = document.querySelectorAll('.ajout-export');
  for (var i=0;i<a.length;i++){ if (a[i].parentNode) a[i].parentNode.removeChild(a[i]); }
  var m = document.querySelectorAll('.masque-impression');
  for (var j=0;j<m.length;j++){ m[j].classList.remove('masque-impression'); }
}
function materialiser(){
  var champs = document.querySelectorAll('textarea,input[type=text]');
  for (var i=0;i<champs.length;i++){
    var e = champs[i];
    if (!estCible(e)) continue;
    var d = document.createElement('div');
    d.className = 'ep-reponse ajout-export';
    var v = (e.value || '').replace(/\s+$/,'');
    d.innerHTML = v ? esc(v).replace(/\n/g,'<br>') : '<i class="ep-vide">— non répondu —</i>';
    if (e.parentNode) e.parentNode.insertBefore(d, e.nextSibling);
    e.classList.add('masque-impression');
  }
}
function exporter(){
  try { if (typeof saveState === 'function') saveState(); } catch (err) {}
  entete();
  nettoyer();
  materialiser();
  var zone = document.getElementById(ID);
  if (zone){
    var t = zone.querySelector('.ep-titre');
    if (t) t.setAttribute('tabindex','-1');
  }
  window.setTimeout(function(){ window.print(); }, 80);
}
document.addEventListener('click', function(ev){
  var c = ev.target;
  while (c && c !== document.body){
    if (c.id === 'btn-export-pdf'){ ev.preventDefault(); exporter(); return; }
    c = c.parentNode;
  }
}, false);
window.exporterSupportPDF = exporter;
})();
</script>
