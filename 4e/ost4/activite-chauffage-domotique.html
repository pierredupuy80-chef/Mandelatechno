<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chauffage domotique</title>
<style>
:root{--bleu:#1f4e79;--bleu2:#2e75b6;--bleuf:#e8f1fa;--orange:#d97706;--orangeF:#fdf1e0;--vert:#2e7d32;--vertF:#e8f5e9;--rouge:#b3261e;--rougeF:#fdecea;--gris:#5b6b7b;--bord:#c9d6e4;--noir:#1f2933}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Liberation Sans",Arial,sans-serif;font-size:17px;line-height:1.5;color:var(--noir);background:#f4f8fc}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--bleu2);padding:10px 16px;box-shadow:0 2px 6px rgba(31,78,121,.08)}
h1{font-size:1.2rem;color:var(--bleu)}h1 small{display:block;font-weight:normal;font-size:.75rem;color:var(--gris)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tabs button{font:inherit;font-size:.88rem;padding:8px 14px;border:2px solid var(--bleu2);background:#fff;color:var(--bleu);border-radius:999px;cursor:pointer;transition:all .2s}
.tabs button.active{background:var(--bleu2);color:#fff}.tabs button:hover:not(.active){background:var(--bleuf)}
main{padding:16px;max-width:900px;margin:0 auto}
section{display:none;animation:fadeIn .3s}section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.badge{display:inline-block;font-size:.7rem;font-weight:bold;text-transform:uppercase;letter-spacing:.04em;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.badge.n1{background:#dbeafe;color:#1e40af}.badge.n2{background:#fef3c7;color:#92400e}.badge.n3{background:#d1fae5;color:#065f46}.badge.n4{background:#fce7f3;color:#9d174d}
h2{font-size:1.15rem;color:var(--bleu);margin:0 0 8px}h3{font-size:1.05rem;color:var(--bleu);margin:12px 0 6px}
p{margin:6px 0}
.info{background:var(--bleuf);border-left:5px solid var(--bleu2);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:.95rem}
.success{background:var(--vertF);border-left-color:var(--vert)}.error{background:var(--rougeF);border-left-color:var(--rouge)}
.match-item{padding:10px 14px;border:2px solid var(--bord);border-radius:10px;cursor:pointer;background:#fff;font-size:.9rem;transition:all .15s;margin-bottom:6px}
.match-item:hover{border-color:var(--bleu2);background:var(--bleuf)}
.match-item.selected{border-color:var(--bleu2);background:var(--bleuf);font-weight:bold}
.match-item.matched{border-color:var(--vert);background:var(--vertF);cursor:default;opacity:.7}
.score-display{font-size:1.3rem;font-weight:bold;color:var(--bleu);text-align:center;padding:12px;background:var(--bleuf);border-radius:10px;margin:12px 0}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.chain-step{display:inline-flex;align-items:center;padding:8px 14px;background:var(--bleuf);border:1px solid var(--bleu2);border-radius:8px;font-size:.9rem;font-weight:bold;margin:4px 0}
.chain-arrow{color:var(--bleu2);font-size:1.2rem;margin:0 6px}
footer{text-align:center;padding:20px;color:var(--gris);font-size:.8rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{background:var(--bleu2);color:#fff;padding:10px;text-align:center}
td{padding:8px;text-align:center;border-bottom:1px solid var(--bord)}
td.best{background:var(--vertF);font-weight:bold}
td:first-child{text-align:left;font-weight:bold}
@media(max-width:600px){.tabs button{font-size:.78rem;padding:6px 10px}}

/* =====================================================================
   AJOUT — RESSOURCES N1 (fiches de connaissances, vidéos, quiz) & EXPORT PDF
   ===================================================================== */
.ressources-n1{margin:16px 0 6px;padding:12px 14px;background:#f7fbff;
  border:1px solid var(--bord,#c9d6e4);border-left:5px solid var(--bleu,#1f4e79);border-radius:10px}
.ressources-n1 > h3{margin:0 0 6px;color:var(--bleu,#1f4e79);font-size:1rem}
.ressources-n1 .note{font-size:.82rem;color:var(--gris,#5b6b7b);margin:.35rem 0}
.ress-carte{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;
  background:#fff;border:1px solid #dbe6f2;border-radius:8px;padding:8px 10px;margin:6px 0}
.ress-code-titre{font-size:.9rem;flex:1 1 320px;line-height:1.35}
.ress-code{display:inline-block;font-weight:bold;font-size:.78rem;letter-spacing:.03em;
  background:#dce9f7;color:var(--bleu,#1f4e79);border-radius:4px;padding:2px 7px;margin-right:6px}
.ress-liens{display:flex;flex-wrap:wrap;gap:6px}
a.ress-lien{font-size:.8rem;text-decoration:none;border-radius:999px;padding:4px 10px;border:1px solid;white-space:nowrap}
a.ress-lien.fiche{background:#fdf0dd;border-color:#d97706;color:#8a4b04}
a.ress-lien.video{background:#f3e5f5;border-color:#6a1b9a;color:#5c1487}
a.ress-lien.quiz{background:#e6f4e7;border-color:#2e7d32;color:#1e5b23}
a.ress-lien.form{background:#eef1fa;border-color:#3b4b8a;color:#2b3768}
.carte-export-pdf{margin:16px 0 6px;padding:14px;background:#fff;border:1px solid var(--bord,#c9d6e4);
  border-left:5px solid var(--vert,#2e7d32);border-radius:10px}
.carte-export-pdf h3{margin:0 0 4px;color:var(--vert,#2e7d32)}
.bouton-export-pdf{font:inherit;font-size:1rem;font-weight:bold;padding:12px 18px;margin-top:8px;
  border:none;border-radius:10px;background:var(--vert,#2e7d32);color:#fff;cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.15)}
.bouton-export-pdf:hover{background:#256428}
#entete-export-pdf{display:none}
.ep-titre{font-size:1.25rem;font-weight:bold;color:#1f4e79}
.ep-sous{font-size:.85rem;color:#5b6b7b;margin:2px 0 6px}
.ep-legende{font-size:.78rem;color:#333;border:1px dashed #8a9bb0;border-radius:6px;
  padding:5px 7px;margin:4px 0 6px}
table.ep-infos{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:6px}
table.ep-infos td{border:1px solid #8a9bb0;padding:4px 6px;vertical-align:top}
.ep-reponse{border:1px solid #99a;border-radius:4px;padding:4px 6px;margin:4px 0;
  white-space:pre-wrap;min-height:1.1em;font-size:.95em;background:#fbfcfe}
.ep-vide{color:#999;font-style:italic}
@media screen{.ajout-export{display:none !important}}
@media print{
  @page{size:A4;margin:12mm 10mm}
  html,body{background:#fff !important;font-size:10.5pt !important;color:#000 !important}
  header,footer,nav,nav.tabs,.onglets,.tabs,.boutons,.barre-progression,#zone-message,
  .no-print,.bouton-export-pdf,.print-btn{display:none !important}
  main{padding:0 !important;margin:0 !important;max-width:none !important;width:auto !important}
  section,.tab-content{display:block !important;page-break-before:always;break-before:page;
    opacity:1 !important;transform:none !important;animation:none !important}
  section:first-of-type,.tab-content:first-of-type{page-break-before:auto;break-before:auto}
  section *, .tab-content *{animation:none !important;transition:none !important}
  section .carte, section .card, section .quiz-question, section .mesure, .tab-content > div{
    opacity:1 !important;visibility:visible !important}
  #entete-export-pdf{display:block !important;margin:0 0 8mm 0}
  .ajout-export{display:block !important}
  .masque-impression{display:none !important}
  .quiz-feedback{display:block !important}
  .carte,.card,.quiz-question,.mesure,.bilan-defi,.carte-export-pdf,.ressources-n1,.ress-carte{
    page-break-inside:avoid;break-inside:avoid}
  a{color:#000 !important;text-decoration:none}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:7.5pt;color:#444;word-break:break-all}
  /* marqueurs de réponse : on voit d'un coup d'œil ce que l'élève a choisi */
  .correct-answer::before,.correct-choice::before,.opt-btn.correct::before,
  .match-item.matched::before,.assoc-item.matched::before,.etiquette-drop.correct::before,
  .tag-selectable.selected::before,.filled::before,.placed::before,.placed-ok::before,
  .quiz-option.selected::before{content:"✔ "}
  .wrong-answer::before,.wrong-choice::before,.opt-btn.wrong::before,.placed-ko::before,
  .incorrect::before{content:"✘ "}
  .quiz-question.correct > p.enonce::before{content:"✔ "}
  .quiz-question.incorrect > p.enonce::before{content:"✘ "}
  .ress-carte{border:none;padding:2px 0;margin:2px 0}
  .ressources-n1{background:#fff;padding:6px 8px}
  .ressources-n1 a[href^="http"]::after{font-size:7pt}
}

/* =====================================================================
   ADAPTATION TELEPHONE (correctifs mobiles)
   Voir Rapport-compatibilite-mobile-apps.md
   - la barre du haut se replie au defilement : seuls les onglets restent
   - onglets sur une seule ligne, defilement horizontal au doigt
   - champs a 16 px : supprime le zoom automatique d'iOS
   - cibles tactiles des QCM et des etiquettes portees a 44 px
   La condition vise les ecrans etroits ET les ecrans peu hauts (telephone
   en paysage). Le prefixe « screen » protege l'impression et l'export PDF.
   ===================================================================== */
@media screen and (max-width: 700px), screen and (max-height: 500px) {

  /* --- En-tete plus compact --- */
  header{padding:8px 10px 6px}
  header h1{font-size:.95rem; line-height:1.15}
  header h1 small{display:block; font-size:.68rem}
  header .bloc-binome, header .header-fields, header .meta{gap:6px; font-size:.78rem}
  header .barre-progression{display:none}

  /* --- Barre d'onglets : une seule ligne, defilement horizontal --- */
  header .onglets, header .tabs, header .tabs-nav, nav.tabs, header + nav, body > nav{
    flex-wrap:nowrap !important;
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    gap:6px;
  }
  header .onglets button, header .tabs button, header .tabs-nav button,
  nav.tabs button, header + nav button, body > nav button{
    flex:0 0 auto; white-space:nowrap; font-size:.76rem; padding:7px 11px;
  }

  /* --- Champs de saisie : 16 px = pas de zoom automatique sur iOS --- */
  input, textarea, select{font-size:16px !important}

  /* --- Reponses de QCM : la ligne entiere devient une cible confortable --- */
  /* min-height est ignore sur un <label> reste en display:inline : on force
     donc un affichage qui tient compte de la hauteur (inline-flex centre le
     texte verticalement et laisse la ligne se poursuivre comme avant). */
  label:has(input[type="radio"]), label:has(input[type="checkbox"]){
    display:inline-flex; align-items:center;
    min-height:44px; min-width:44px; box-sizing:border-box}
  label.option-choix, label.quiz-option, .opt-btn{min-height:44px}
  input[type="radio"], input[type="checkbox"]{width:22px; height:22px; flex:0 0 auto}

  /* --- Etiquettes a deplacer --- */
  .etiquette, .assoc-item, .etiquette-drop, .chip{min-height:44px; box-sizing:border-box}
  .etiquette, .assoc-item, .chip{display:inline-flex; align-items:center}
  .etiquette-drop{display:flex; align-items:center}

  /* --- Repere visuel de l'etiquette selectionnee au doigt --- */
  .etiquette.selectionnee, .assoc-item.selectionnee, .chip.selectionnee{
    outline:3px solid #ef6c00; background:#fff3e0; border-color:#ef6c00}
}

/* --- Cibles tactiles : jamais sous 44 px (onglets et liens de ressources) ---
   Memes correctifs que le gabarit de reference ; ils passent apres la
   coquille dans la feuille, donc ils gagnent sans la modifier. */
.tabs button{min-height:44px}
a.ress-lien{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px}
.ressources-n1 .note a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px}

@media (max-width:600px){
  .tabs button{min-height:44px;padding:8px 12px}
  a.ress-lien{width:100%;justify-content:center}
}

<!-- Correctifs telephone : barre repliable, onglets sur une ligne, retour en
     haut au changement de niveau, compensation des sauts d'ancre.
     Voir Rapport-compatibilite-mobile-apps.md
     Ce script est place juste apres <body> : il attend que le DOM soit
     construit avant de mesurer quoi que ce soit. -->
<script>
(function () {
  // Conteneurs d'onglets possibles, selon la structure de l'app.
  var SELECTEUR_ONGLETS =
    'header .onglets, header .tabs, header .tabs-nav, nav.tabs, header + nav, body > nav';

  function trouverOnglets() {
    var liste = document.querySelectorAll(SELECTEUR_ONGLETS);
    for (var i = 0; i < liste.length; i++) {
      if (liste[i].querySelector('button')) return liste[i];
    }
    return null;
  }

  function ajuster() {
    var entete = document.querySelector('header');
    var onglets = trouverOnglets();
    if (!entete || !onglets) return;
    var petit = window.matchMedia('(max-width: 700px), (max-height: 500px)').matches;

    if (!petit) {
      // Ordinateur : on rend la main au CSS d'origine.
      entete.style.top = '0px';
      onglets.style.position = '';
      onglets.style.top = '';
      document.documentElement.style.scrollPaddingTop =
        (entete.offsetHeight + 8) + 'px';
      return;
    }

    if (entete.contains(onglets)) {
      // Onglets DANS l'en-tete : on replie l'en-tete jusqu'aux onglets.
      // Le titre et les champs binome/classe sortent de l'ecran au
      // defilement, les onglets restent sous les yeux.
      var hautEntete = entete.getBoundingClientRect().top + window.scrollY;
      var hautOnglets = onglets.getBoundingClientRect().top + window.scrollY;
      var dessus = Math.max(0, Math.round(hautOnglets - hautEntete));
      entete.style.top = (-dessus) + 'px';
    } else {
      // Onglets HORS de l'en-tete : l'en-tete disparait entierement au
      // defilement et la barre d'onglets se colle en haut de l'ecran.
      entete.style.top = (-entete.offsetHeight) + 'px';
      onglets.style.position = 'sticky';
      onglets.style.top = '0px';
      var fond = getComputedStyle(onglets).backgroundColor;
      if (!fond || fond === 'rgba(0, 0, 0, 0)' || fond === 'transparent') {
        onglets.style.background = '#fff';
      }
      if (getComputedStyle(onglets).zIndex === 'auto') onglets.style.zIndex = '30';
    }

    // Les sauts d'ancre et les scrollIntoView ne passent plus sous la barre.
    var hauteurBarre = Math.round(onglets.getBoundingClientRect().height);
    document.documentElement.style.scrollPaddingTop = (hauteurBarre + 8) + 'px';
  }

  // Retour en haut au changement de niveau. Ecouteur delegue : il fonctionne
  // quelle que soit la mecanique propre a l'app (data-tab, switchTab, onclick).
  function retourEnHaut(e) {
    var cible = e.target;
    if (!cible || !cible.closest) return;
    var bouton = cible.closest('button');
    if (!bouton || !bouton.closest(SELECTEUR_ONGLETS)) return;
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function demarrer() {
    ajuster();
    document.addEventListener('click', retourEnHaut, true);
    window.addEventListener('resize', ajuster);
    window.addEventListener('orientationchange', ajuster);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajuster);
    window.setTimeout(ajuster, 300);   // apres application des styles et des polices
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', demarrer);
  } else {
    demarrer();
  }
  window.addEventListener('load', demarrer);
})();
</script>

function renderCardSort(){

});
h+='</div><div class="grid-3" id="cs-items">';
const sh=[...ITEMS].sort(()=>Math.random()-.5);
sh.forEach(item=>{

});

window.selCS=function(el,type,val){
if(el.classList.contains("matched"))return;
if(!csSel){document.querySelectorAll(".match-item.selected").forEach(e=>e.classList.remove("selected"));el.classList.add("selected");csSel={type,val,el};}
else if(csSel.type===type){csSel.el.classList.remove("selected");el.classList.add("selected");csSel={type,val,el};}
else{
if(csSel.val===val){csSel.el.classList.remove("selected");csSel.el.classList.add("matched");el.classList.remove("selected");el.classList.add("matched");csCount++;
if(csCount===ITEMS.length){document.getElementById("cs-score").style.display="block";document.getElementById("cs-score").textContent="🎉 Tous les systèmes classés correctement ! Bravo !";}
}else{csSel.el.classList.remove("selected");el.style.background="var(--rougeF)";setTimeout(()=>el.style.background="",500);}
csSel=null;
}
};

function renderEnergyChain(){

});

}

h+='<div class="card info"><strong>💡 Conseil :</strong> Avant d\'acheter un système de chauffage, vérifiez toujours sa compatibilité avec votre écosystème domotique existant. Les protocoles ouverts (Matter, Zigbee) offrent plus de flexibilité.</div>';
return h;
}

/* === N4 COMPARISON TABLE === */
const SYSTEMS=[
{name:"Convecteur électrique",install:200,annual:1800,co2:0.079,life:20,comfort:2},
{name:"Chaudière gaz condensation",install:5000,annual:1200,co2:0.227,life:20,comfort:4},
{name:"Poêle à granulés",install:3500,annual:800,co2:0.030,life:15,comfort:3},
{name:"PAC air-air",install:8000,annual:600,co2:0.026,life:15,comfort:5}
];
const CRITERIA=[
{label:"Coût installation",key:"install",unit:"€",best:"min"},
{label:"Coût annuel",key:"annual",unit:"€/an",best:"min"},
{label:"Émissions CO₂",key:"co2",unit:"kg CO₂/kWh",best:"min"},
{label:"Durée de vie",key:"life",unit:"ans",best:"max"},
{label:"Confort thermique",key:"comfort",unit:"/5",best:"max"}
];

function renderCompTable(){
let h='<div class="card"><span class="badge n4">N4 — Analyser</span><h2>Comparaison performance & impact environnemental</h2>';
h+='<p>Analysez les critères techniques, économiques et environnementaux de 4 systèmes de chauffage.</p></div>';
h+='<div class="card" style="overflow-x:auto"><table><thead><tr><th>Critère</th>';
SYSTEMS.forEach(s=>{h+='<th>'+s.name+'</th>';});
h+='</tr></thead><tbody>';
CRITERIA.forEach(cr=>{
const vals=SYSTEMS.map(s=>s[cr.key]);
const bestVal=cr.best==="min"?Math.min(...vals):Math.max(...vals);
h+='<tr><td>'+cr.label+'</td>';
SYSTEMS.forEach(s=>{
const v=s[cr.key],isBest=v===bestVal;
h+='<td'+(isBest?' class="best"':'')+'>'+v+' '+cr.unit+'</td>';
});
h+='</tr>';
});
h+='</tbody></table></div>';
h+='<div class="card info success"><strong>💡 Bilan :</strong> La <strong>PAC air-air</strong> offre le meilleur compromis performance/environnement malgré un coût d\'installation élevé (amorti en ~7 ans). Le <strong>poêle à granulés</strong> est le plus écologique (biomasse renouvelable). Le convecteur électrique, bien que peu cher à l\'achat, est le plus coûteux et le moins confortable sur le long terme.</div>';
h+='<div class="card"><h3>🤔 Question de synthèse</h3>';
h+='<p>Si vous deviez équiper une maison neuve en respectant le développement durable, quel système choisiriez-vous ? Justifiez votre choix en citant au moins 3 critères du tableau.</p>';
h+='<textarea style="width:100%;min-height:80px;padding:10px;border:2px solid var(--bord);border-radius:8px;font:inherit;font-size:.95rem;resize:vertical" placeholder="Votre réponse ici..."></textarea>';
h+='<p style="font-size:.8rem;color:var(--gris);margin-top:4px">💡 Cette question peut servir de support pour un débat ou une évaluation écrite en classe.</p></div>';
return h;
}

init();
</script>

<!-- ===== Module d'export PDF : impression du support complet avec les réponses ===== -->
<script>
(function(){
'use strict';
var NIVEAU = "4e";
var ID = 'entete-export-pdf';

function val(selecteurs){
  for (var i=0;i<selecteurs.length;i++){
    var e = document.querySelector(selecteurs[i]);
    if (e && e.value && e.value.replace(/\s+/g,'')) return e.value.trim();
  }
  return '';
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function estCible(e){
  if (!e || e.disabled) return false;
  if (e.type === 'password' || e.type === 'number' || e.type === 'hidden') return false;
  if (e.id === 'binome' || e.id === 'classe' || e.id === 'nom') return false;
  if (e.closest && e.closest('header')) return false;   // champs binôme / classe (imprimés dans l'en-tête)
  if (e.tagName === 'TEXTAREA' || e.tagName === 'INPUT') return true;
  return false;
}
function entete(){
  var z = document.getElementById(ID);
  if (!z){
    z = document.createElement('div');
    z.id = ID;
    document.body.insertBefore(z, document.body.firstChild);
  }
  var titre = document.title || 'Activité de technologie';
  var h1 = document.querySelector('h1');
  if (h1){
    var copie = h1.cloneNode(true);
    var sm = copie.querySelector('small');
    if (sm && sm.parentNode) sm.parentNode.removeChild(sm);
    var t = (copie.textContent || '').replace(/\s+/g,' ').trim();
    if (t) titre = t;
  }
  var eleve = val(['#binome','#nom','#eleve','#nom-eleve','.bloc-binome input[type=text]',
                   'header input[type=text][placeholder*="nom"]',
                   'header input[type=text][placeholder*="Prenom"]',
                   'header input[type=text]']);
  var classe = val(['#classe','input[type=text][placeholder*="Classe"]',
                    'input[type=text][placeholder*="classe"]',
                    'input[type=text][placeholder*="5e"]','input[type=text][placeholder*="4e"]',
                    'input[type=text][placeholder*="3e"]']);
  var d = new Date();
  var quand = d.toLocaleDateString('fr-FR') + ' ' +
              d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  z.innerHTML = '<div class="ep-titre">' + esc(titre) + '</div>' +
    '<div class="ep-sous">Technologie — cycle 4 — niveau ' + esc(NIVEAU) +
    " · Support d'activité imprimé avec les réponses de l'élève</div>" +
    '<table class="ep-infos"><tr>' +
    '<td><b>Binôme / élève :</b> ' + esc(eleve || '…………………………') + '</td>' +
    '<td><b>Classe :</b> ' + esc(classe || '…………') + '</td>' +
    '<td><b>Date :</b> ' + esc(quand) + '</td>' +
    '</tr></table>' +
    '<div class="ep-legende">Repères de lecture : fond <b>vert</b> = réponse réussie ; fond <b>rouge</b> = réponse erronée ;' +
    ' encadré = réponse écrite saisie par l’élève ; « — non répondu — » = question non traitée.</div>';
}
function nettoyer(){
  var a = document.querySelectorAll('.ajout-export');
  for (var i=0;i<a.length;i++){ if (a[i].parentNode) a[i].parentNode.removeChild(a[i]); }
  var m = document.querySelectorAll('.masque-impression');
  for (var j=0;j<m.length;j++){ m[j].classList.remove('masque-impression'); }
}
function materialiser(){
  var champs = document.querySelectorAll('textarea,input[type=text]');
  for (var i=0;i<champs.length;i++){
    var e = champs[i];
    if (!estCible(e)) continue;
    var d = document.createElement('div');
    d.className = 'ep-reponse ajout-export';
    var v = (e.value || '').replace(/\s+$/,'');
    d.innerHTML = v ? esc(v).replace(/\n/g,'<br>') : '<i class="ep-vide">— non répondu —</i>';
    if (e.parentNode) e.parentNode.insertBefore(d, e.nextSibling);
    e.classList.add('masque-impression');
  }
}
function exporter(){
  try { if (typeof saveState === 'function') saveState(); } catch (err) {}
  entete();
  nettoyer();
  materialiser();
  var zone = document.getElementById(ID);
  if (zone){
    var t = zone.querySelector('.ep-titre');
    if (t) t.setAttribute('tabindex','-1');
  }
  window.setTimeout(function(){ window.print(); }, 80);
}
document.addEventListener('click', function(ev){
  var c = ev.target;
  while (c && c !== document.body){
    if (c.id === 'btn-export-pdf'){ ev.preventDefault(); exporter(); return; }
    c = c.parentNode;
  }
}, false);
window.exporterSupportPDF = exporter;
})();
</script>
</body>
</html>
