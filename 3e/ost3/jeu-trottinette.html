<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le trajet du prof de techno</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        #game-container {
            background: #0f3460;
            border: 4px solid #e94560;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
        }
        
        h1 {
            text-align: center;
            color: #e94560;
            margin-bottom: 10px;
            font-size: 24px;
            text-shadow: 2px 2px 0 #16213e;
        }
        
        #game-canvas {
            border: 3px solid #16213e;
            background: #87ceeb;
            display: block;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        #ui {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            font-size: 14px;
        }
        
        .stat {
            background: #16213e;
            padding: 8px 15px;
            border-radius: 4px;
            border: 2px solid #e94560;
        }
        
        .stat-label {
            color: #e94560;
            font-weight: bold;
        }
        
        #controls {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #aaa;
        }
        
        #menu, #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 52, 96, 0.95);
            padding: 30px;
            border: 4px solid #e94560;
            border-radius: 8px;
            text-align: center;
            z-index: 100;
        }
        
        .hidden {
            display: none !important;
        }
        
        button {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin: 10px 5px;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #ff6b6b;
            transform: scale(1.05);
        }
        
        .scooter-option {
            background: #16213e;
            border: 2px solid #e94560;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        
        .scooter-option:hover {
            background: #1a1a2e;
            border-color: #ff6b6b;
            transform: translateX(5px);
        }
        
        .scooter-option.selected {
            background: #e94560;
            border-color: #ff6b6b;
        }
        
        .scooter-name {
            font-weight: bold;
            color: #e94560;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .scooter-option.selected .scooter-name {
            color: #fff;
        }
        
        .scooter-stats {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
        
        .scooter-option.selected .scooter-stats {
            color: #fff;
        }
        
        #weather-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(22, 33, 62, 0.9);
            padding: 8px 12px;
            border-radius: 4px;
            border: 2px solid #e94560;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>🛴 Le trajet du prof de techno</h1>
        <canvas id="game-canvas" width="800" height="400"></canvas>
        <div id="ui">
            <div class="stat">
                <span class="stat-label">Distance:</span>
                <span id="distance">0</span> m
            </div>
            <div class="stat">
                <span class="stat-label">Vitesse:</span>
                <span id="speed">0</span> km/h
            </div>
            <div class="stat">
                <span class="stat-label">Batterie:</span>
                <span id="battery">100</span>%
            </div>
            <div class="stat">
                <span class="stat-label">Score:</span>
                <span id="score">0</span>
            </div>
        </div>
        <div id="controls">
            Flèches ↑↓ pour éviter les obstacles | Espace pour freiner
        </div>
    </div>
    
    <div id="menu">
        <h2 style="color: #e94560; margin-bottom: 20px;">Choisis ta trottinette</h2>
        <div id="scooter-list"></div>
        <button id="start-btn" disabled>Commencer le trajet</button>
    </div>
    
    <div id="game-over" class="hidden">
        <h2 style="color: #e94560; margin-bottom: 15px;">Trajet terminé !</h2>
        <p id="final-score" style="font-size: 18px; margin-bottom: 10px;"></p>
        <p id="final-distance" style="margin-bottom: 20px;"></p>
        <button id="restart-btn">Rejouer</button>
        <button id="menu-btn">Changer de trottinette</button>
    </div>
    
    <div id="weather-indicator" class="hidden">
        <span id="weather-text">☀️ Beau temps</span>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        // Trottinettes disponibles
        const scooters = [
            {
                name: "Xiaomi Essential",
                battery: 80,
                speed: 20,
                weight: 12,
                wheels: 8.5,
                braking: 7,
                description: "Légère et maniable, mais batterie limitée"
            },
            {
                name: "Dualtron Thunder",
                battery: 100,
                speed: 35,
                weight: 25,
                wheels: 10,
                braking: 9,
                description: "Puissante et stable, mais lourde"
            },
            {
                name: "Ninebot Max",
                battery: 90,
                speed: 25,
                weight: 18,
                wheels: 10,
                braking: 8,
                description: "Bon équilibre performance/poids"
            },
            {
                name: "Segway ES2",
                battery: 70,
                speed: 22,
                weight: 11,
                wheels: 8,
                braking: 6,
                description: "Compacte mais freinage limité"
            }
        ];
        
        // Conditions météo
        const weatherConditions = [
            { name: "Beau temps", icon: "☀️", grip: 1.0, batteryDrain: 1.0, visibility: 1.0 },
            { name: "Pluie", icon: "🌧️", grip: 0.7, batteryDrain: 1.2, visibility: 0.8 },
            { name: "Froid", icon: "🥶", grip: 0.9, batteryDrain: 1.5, visibility: 1.0 },
            { name: "Chaleur", icon: "🔥", grip: 0.95, batteryDrain: 1.3, visibility: 1.0 },
            { name: "Brouillard", icon: "🌫️", grip: 0.9, batteryDrain: 1.0, visibility: 0.5 }
        ];
        
        // État du jeu
        let gameState = {
            running: false,
            selectedScooter: null,
            currentWeather: weatherConditions[0],
            player: { x: 100, y: 200, vy: 0, width: 40, height: 60 },
            obstacles: [],
            particles: [],
            distance: 0,
            speed: 0,
            battery: 100,
            score: 0,
            scrollSpeed: 3,
            groundY: 300,
            keys: {},
            weatherTimer: 0,
            obstacleTimer: 0
        };
        
        // Initialisation du menu
        function initMenu() {
            const list = document.getElementById('scooter-list');
            list.innerHTML = '';
            
            scooters.forEach((scooter, index) => {
                const div = document.createElement('div');
                div.className = 'scooter-option';
                div.innerHTML = `
                    <div class="scooter-name">${scooter.name}</div>
                    <div class="scooter-stats">
                        Batterie: ${scooter.battery}% | Vitesse max: ${scooter.speed} km/h<br>
                        Poids: ${scooter.weight}kg | Roues: ${scooter.wheels}" | Freinage: ${scooter.braking}/10<br>
                        <em>${scooter.description}</em>
                    </div>
                `;
                div.onclick = () => selectScooter(index);
                list.appendChild(div);
            });
        }
        
        function selectScooter(index) {
            gameState.selectedScooter = scooters[index];
            document.querySelectorAll('.scooter-option').forEach((el, i) => {
                el.classList.toggle('selected', i === index);
            });
            document.getElementById('start-btn').disabled = false;
        }
        
        function startGame() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('weather-indicator').classList.remove('hidden');
            
            gameState.running = true;
            gameState.distance = 0;
            gameState.speed = gameState.selectedScooter.speed * 0.5;
            gameState.battery = gameState.selectedScooter.battery;
            gameState.score = 0;
            gameState.player.y = gameState.groundY - gameState.player.height;
            gameState.obstacles = [];
            gameState.particles = [];
            gameState.currentWeather = weatherConditions[0];
            gameState.weatherTimer = 0;
            gameState.obstacleTimer = 0;
            
            updateWeatherDisplay();
            gameLoop();
        }
        
        function gameLoop() {
            if (!gameState.running) return;
            
            update();
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function update() {
            // Changement météo aléatoire
            gameState.weatherTimer++;
            if (gameState.weatherTimer > 600) { // Toutes les ~10 secondes
                if (Math.random() < 0.3) {
                    gameState.currentWeather = weatherConditions[Math.floor(Math.random() * weatherConditions.length)];
                    updateWeatherDisplay();
                }
                gameState.weatherTimer = 0;
            }
            
            // Génération d'obstacles
            gameState.obstacleTimer++;
            const obstacleFrequency = 120 - (gameState.distance / 50); // Plus on avance, plus c'est fréquent
            if (gameState.obstacleTimer > Math.max(60, obstacleFrequency)) {
                if (Math.random() < 0.4) {
                    spawnObstacle();
                }
                gameState.obstacleTimer = 0;
            }
            
            // Contrôle joueur
            const maxSpeed = gameState.selectedScooter.speed * gameState.currentWeather.grip;
            if (gameState.keys['ArrowUp'] && gameState.player.y > 50) {
                gameState.player.vy = -5;
            } else if (gameState.keys['ArrowDown'] && gameState.player.y < gameState.groundY - gameState.player.height) {
                gameState.player.vy = 5;
            } else {
                gameState.player.vy *= 0.8;
            }
            
            if (gameState.keys[' ']) {
                gameState.speed = Math.max(5, gameState.speed - 0.5);
            } else {
                gameState.speed = Math.min(maxSpeed, gameState.speed + 0.1);
            }
            
            gameState.player.y += gameState.player.vy;
            gameState.player.y = Math.max(50, Math.min(gameState.groundY - gameState.player.height, gameState.player.y));
            
            // Défilement
            gameState.scrollSpeed = gameState.speed / 10;
            gameState.distance += gameState.scrollSpeed * 0.5;
            
            // Mise à jour obstacles
            gameState.obstacles.forEach(obs => {
                obs.x -= gameState.scrollSpeed;
            });
            gameState.obstacles = gameState.obstacles.filter(obs => obs.x > -100);
            
            // Collision
            gameState.obstacles.forEach(obs => {
                if (checkCollision(gameState.player, obs)) {
                    endGame(false);
                }
            });
            
            // Consommation batterie
            const batteryDrain = 0.01 * gameState.currentWeather.batteryDrain * (gameState.speed / 20);
            gameState.battery -= batteryDrain;
            
            if (gameState.battery <= 0) {
                endGame(true);
            }
            
            // Score
            gameState.score = Math.floor(gameState.distance);
            
            // Particules météo
            if (gameState.currentWeather.name === "Pluie") {
                if (Math.random() < 0.5) {
                    gameState.particles.push({
                        x: Math.random() * canvas.width,
                        y: -10,
                        vy: 8,
                        life: 100
                    });
                }
            }
            
            gameState.particles.forEach(p => {
                p.y += p.vy;
                p.life--;
            });
            gameState.particles = gameState.particles.filter(p => p.life > 0 && p.y < canvas.height);
            
            // UI
            document.getElementById('distance').textContent = Math.floor(gameState.distance);
            document.getElementById('speed').textContent = Math.floor(gameState.speed);
            document.getElementById('battery').textContent = Math.floor(gameState.battery);
            document.getElementById('score').textContent = gameState.score;
        }
        
        function spawnObstacle() {
            const types = [
                { type: 'pothole', width: 50, height: 20, y: gameState.groundY - 20, color: '#333' },
                { type: 'cone', width: 30, height: 40, y: gameState.groundY - 40, color: '#ff6b35' },
                { type: 'pedestrian', width: 30, height: 50, y: gameState.groundY - 50, color: '#8b4513' },
                { type: 'car', width: 80, height: 50, y: gameState.groundY - 50, color: '#c41e3a' }
            ];
            
            const template = types[Math.floor(Math.random() * types.length)];
            gameState.obstacles.push({
                x: canvas.width,
                y: template.y,
                width: template.width,
                height: template.height,
                type: template.type,
                color: template.color
            });
        }
        
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        function render() {
            // Ciel
            ctx.fillStyle = '#87ceeb';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Sol
            ctx.fillStyle = '#654321';
            ctx.fillRect(0, gameState.groundY, canvas.width, canvas.height - gameState.groundY);
            
            // Route
            ctx.fillStyle = '#555';
            ctx.fillRect(0, gameState.groundY - 10, canvas.width, 10);
            
            // Lignes route
            ctx.fillStyle = '#fff';
            for (let i = 0; i < canvas.width; i += 80) {
                const offset = (gameState.distance * 10) % 80;
                ctx.fillRect(i - offset, gameState.groundY - 5, 40, 3);
            }
            
            // Bâtiments en arrière-plan
            ctx.fillStyle = '#4a5568';
            for (let i = 0; i < canvas.width; i += 150) {
                const offset = (gameState.distance * 2) % 150;
                ctx.fillRect(i - offset, 150, 80, 140);
                ctx.fillStyle = '#ffd700';
                for (let j = 0; j < 3; j++) {
                    for (let k = 0; k < 4; k++) {
                        ctx.fillRect(i - offset + 10 + j * 25, 170 + k * 30, 15, 20);
                    }
                }
                ctx.fillStyle = '#4a5568';
            }
            
            // Obstacles
            gameState.obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                
                // Détails selon type
                if (obs.type === 'pedestrian') {
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(obs.x + 10, obs.y + 5, 10, 10); // Tête
                } else if (obs.type === 'car') {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(obs.x + 10, obs.y + 35, 15, 15); // Roue avant
                    ctx.fillRect(obs.x + 55, obs.y + 35, 15, 15); // Roue arrière
                }
            });
            
            // Joueur (prof sur trottinette)
            drawPlayer();
            
            // Particules (pluie)
            if (gameState.currentWeather.name === "Pluie") {
                ctx.strokeStyle = '#4a90e2';
                ctx.lineWidth = 2;
                gameState.particles.forEach(p => {
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x, p.y + 10);
                    ctx.stroke();
                });
            }
            
            // Effet brouillard
            if (gameState.currentWeather.name === "Brouillard") {
                ctx.fillStyle = 'rgba(200, 200, 200, 0.3)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }
        
        function drawPlayer() {
            const x = gameState.player.x;
            const y = gameState.player.y;
            
            // Trottinette
            ctx.fillStyle = '#333';
            ctx.fillRect(x + 5, y + 45, 30, 5); // Plateforme
            ctx.fillRect(x + 10, y + 50, 3, 10); // Roue avant
            ctx.fillRect(x + 27, y + 50, 3, 10); // Roue arrière
            ctx.fillRect(x + 8, y + 20, 3, 25); // Guidon
            
            // Prof
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(x + 12, y + 25, 16, 20); // Corps
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(x + 15, y + 10, 10, 12); // Tête
            ctx.fillStyle = '#000';
            ctx.fillRect(x + 17, y + 14, 2, 2); // Yeux
            ctx.fillRect(x + 21, y + 14, 2, 2);
        }
        
        function updateWeatherDisplay() {
            document.getElementById('weather-text').textContent = 
                `${gameState.currentWeather.icon} ${gameState.currentWeather.name}`;
        }
        
        function endGame(batteryEmpty) {
            gameState.running = false;
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('final-score').textContent = 
                `Score: ${gameState.score} points`;
            document.getElementById('final-distance').textContent = 
                batteryEmpty ? 
                "Plus de batterie ! Tu as parcouru " + Math.floor(gameState.distance) + " m" :
                "Crash ! Tu as parcouru " + Math.floor(gameState.distance) + " m";
        }
        
        function resetGame() {
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('weather-indicator').classList.add('hidden');
            gameState.selectedScooter = null;
            document.querySelectorAll('.scooter-option').forEach(el => el.classList.remove('selected'));
            document.getElementById('start-btn').disabled = true;
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            gameState.keys[e.key] = true;
            if (e.key === ' ') e.preventDefault();
        });
        
        document.addEventListener('keyup', (e) => {
            gameState.keys[e.key] = false;
        });
        
        document.getElementById('start-btn').onclick = startGame;
        document.getElementById('restart-btn').onclick = () => {
            document.getElementById('game-over').classList.add('hidden');
            startGame();
        };
        document.getElementById('menu-btn').onclick = resetGame;
        
        // Initialisation
        initMenu();
    </script>
</body>
</html>
