<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le trajet ensoleillé du prof de techno</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #87ceeb 0%, #98d8e8 100%);
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        #game-container {
            background: #fff;
            border: 6px solid #f39c12;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(243, 156, 18, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #e67e22;
            margin-bottom: 10px;
            font-size: 28px;
            text-shadow: 2px 2px 0 #f9ca24;
        }
        
        #game-canvas {
            border: 4px solid #f39c12;
            background: #87ceeb;
            display: block;
            touch-action: none;
            cursor: pointer;
            width: 100%;
            max-width: 600px;
            height: auto;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            border-radius: 8px;
        }
        
        #ui {
            margin-top: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 14px;
        }

        #scooter-hud {
            width: 18px;
            height: 36px;
            image-rendering: pixelated;
            vertical-align: middle;
        }

        .scooter-vignette {
            width: 32px;
            height: 64px;
            image-rendering: pixelated;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        .stat {
            background: #fff9e6;
            padding: 10px 18px;
            border-radius: 8px;
            border: 3px solid #f39c12;
            box-shadow: 0 2px 8px rgba(243, 156, 18, 0.2);
        }
        
        .stat-label {
            color: #e67e22;
            font-weight: bold;
            margin-right: 5px;
        }
        
        #controls {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #7f8c8d;
            background: #fff9e6;
            padding: 10px;
            border-radius: 8px;
            border: 2px dashed #f39c12;
        }
        
        #menu, #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            padding: 35px;
            border: 6px solid #f39c12;
            border-radius: 12px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(243, 156, 18, 0.4);
            max-width: 600px;
        }
        
        .hidden {
            display: none !important;
        }
        
        button {
            background: #f39c12;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            margin: 10px 5px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
        }
        
        button:hover {
            background: #e67e22;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(243, 156, 18, 0.4);
        }
        
        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        
        .scooter-option {
            background: #fff9e6;
            border: 3px solid #f39c12;
            padding: 18px;
            margin: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        
        .scooter-option:hover {
            background: #ffeaa7;
            border-color: #e67e22;
            transform: translateX(8px);
        }
        
        .scooter-option.selected {
            background: #f39c12;
            border-color: #e67e22;
            color: #fff;
        }
        
        .scooter-name {
            font-weight: bold;
            color: #e67e22;
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .scooter-option.selected .scooter-name {
            color: #fff;
        }
        
        .scooter-stats {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 6px;
            line-height: 1.6;
        }
        
        .scooter-option.selected .scooter-stats {
            color: #fff;
        }
        
        #weather-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 8px;
            border: 3px solid #f39c12;
            font-size: 14px;
            font-weight: bold;
            color: #e67e22;
            box-shadow: 0 2px 8px rgba(243, 156, 18, 0.3);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>☀️ Le trajet ensoleillé du prof de techno</h1>
        <canvas id="game-canvas" width="600" height="700"></canvas>
        <div id="ui">
            <div class="stat">
                <span class="stat-label">📏 Distance:</span>
                <span id="distance">0</span> m
            </div>
            <div class="stat">
                <span class="stat-label">🚀 Vitesse:</span>
                <span id="speed">0</span> km/h
            </div>
            <div class="stat">
                <span class="stat-label">🔋 Batterie:</span>
                <span id="battery">100</span>%
            </div>
            <div class="stat">
                <span class="stat-label">⭐ Score:</span>
                <span id="score">0</span>
            </div>
            <div class="stat">
                <img id="scooter-hud" alt="Trottinette choisie">
                <span id="scooter-nom"></span>
            </div>
        </div>
        <div id="controls">
            ← → pour se déplacer | ↑ pour accélérer | ↓ pour ralentir
        </div>
    </div>
    
    <div id="menu">
        <h2 style="color: #e67e22; margin-bottom: 20px;">🛴 Choisis ta trottinette</h2>
        <div id="scooter-list"></div>
        <button id="start-btn" disabled>🌞 Commencer le trajet</button>
    </div>
    
    <div id="game-over" class="hidden">
        <h2 style="color: #e67e22; margin-bottom: 15px;">🎯 Trajet terminé !</h2>
        <p id="final-score" style="font-size: 20px; margin-bottom: 10px; font-weight: bold;"></p>
        <p id="final-distance" style="margin-bottom: 20px; font-size: 16px;"></p>
        <button id="restart-btn">🔄 Rejouer</button>
        <button id="menu-btn">🛴 Changer de trottinette</button>
    </div>
    
    <div id="weather-indicator" class="hidden">
        <span id="weather-text">☀️ Beau temps</span>
    </div>

        /* ASSETS-FIN */

        // Préchargement : le jeu ne démarre qu'une fois les sprites décodés.
        const IMG = {};
        let assetsPrets = false;
        function prechargerAssets() {
            const clefs = Object.keys(ASSETS_B64);
            if (!clefs.length) { assetsPrets = true; return Promise.resolve(); }
            return Promise.all(clefs.map(clef => new Promise(res => {
                if (IMG[clef]) { res(); return; }
                const img = new Image();
                img.onload = () => { IMG[clef] = img; res(); };
                img.onerror = () => { console.warn('sprite illisible : ' + clef); res(); };
                img.src = ASSETS_B64[clef];
            }))).then(() => { assetsPrets = true; });
        }
        function sprite(nom) {
            const img = IMG[nom];
            return (img && img.complete && img.naturalWidth) ? img : null;
        }

                wheels: 8,
                braking: 6,
                description: "Compacte mais freinage limité",
                sprite: "trottinetteSegway",
                accent: "#e74c3c"
            }
        ];
        
        // Conditions météo
        const weatherConditions = [
            { name: "Beau temps", icon: "☀️", grip: 1.0, batteryDrain: 1.0, visibility: 1.0 },
            { name: "Pluie", icon: "🌧️", grip: 0.7, batteryDrain: 1.2, visibility: 0.8 },
            { name: "Froid", icon: "🥶", grip: 0.9, batteryDrain: 1.5, visibility: 1.0 },
            { name: "Chaleur", icon: "🔥", grip: 0.95, batteryDrain: 1.3, visibility: 1.0 },
            { name: "Vent", icon: "💨", grip: 0.85, batteryDrain: 1.1, visibility: 1.0 }
        ];
        
        // État du jeu
        let gameState = {
            running: false,
            selectedScooter: null,
            currentWeather: weatherConditions[0],
            player: { x: 300, y: 600, width: 40, height: 60, vx: 0, saut: false, vy: 0, solY: 600 },
            obstacles: [],
            decorations: [],
            distance: 0,
            speed: 0,
            battery: 100,
            score: 0,
            scrollSpeed: 3,
            keys: {},
            weatherTimer: 0,
            obstacleTimer: 0,
            decorationTimer: 0,
            roadOffset: 0,
            // REFONTE-V3
            t: 0,              // horloge d'animation (trames)
            rampe: 1,          // montée en difficulté
            bonus: 0,          // points gagnés en évitant les obstacles
            popups: [],        // « +10 » flottants
            particules: [],    // météo
            meteoNom: '',
            flash: 0,          // écran rouge au crash
            /* V4-ANIMATIONS */
            demarrage: 0,      // trames d'élan au départ
            poussiere: [],     // particules derrière la roue arrière
            etoiles: [],       // étoiles de la chute
            crash: 0,          // > 0 : le prof est tombé
            motifFin: '',
            ballon: { x: 118, y: 150, phase: 0 },
            avion: { x: -90, y: 96, v: 1.7 },
            nuages: [ {x: 90, y: 74, v: 0.16, e: 0.9}, {x: 330, y: 128, v: 0.11, e: 0.7}, {x: 520, y: 54, v: 0.2, e: 1.05} ]
        };
        
        // Initialisation du menu
        function initMenu() {
            const list = document.getElementById('scooter-list');
            list.innerHTML = '';
            
            scooters.forEach((scooter, index) => {
                const div = document.createElement('div');
                div.className = 'scooter-option';
                div.innerHTML = `
                    <div class="scooter-name">
                        <img class="scooter-vignette" src="${ASSETS_B64[scooter.sprite] || ''}" alt="Trottinette ${scooter.name} en pixel art">
                        ${scooter.name}
                    </div>
                    <div class="scooter-stats">
                        🔋 Batterie: ${scooter.battery}% | 🚀 Vitesse max: ${scooter.speed} km/h<br>
                        ⚖️ Poids: ${scooter.weight}kg | 🛞 Roues: ${scooter.wheels}" | 🛑 Freinage: ${scooter.braking}/10<br>
                        <em>${scooter.description}</em>
                    </div>
                `;
                div.onclick = () => selectScooter(index);
                list.appendChild(div);
            });
        }
        
        function selectScooter(index) {
            gameState.selectedScooter = scooters[index];
            document.querySelectorAll('.scooter-option').forEach((el, i) => {
                el.classList.toggle('selected', i === index);
            });
            document.getElementById('start-btn').disabled = false;
        }
        
        let demarrageEnCours = false;
        function startGame() {
            if (demarrageEnCours) return;
            demarrageEnCours = true;
            prechargerAssets().then(() => {
                demarrageEnCours = false;
                lancerPartie();
            });
        }

        function lancerPartie() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('weather-indicator').classList.remove('hidden');

            const hud = document.getElementById('scooter-hud');
            if (hud) {
                hud.src = ASSETS_B64[gameState.selectedScooter.sprite] || '';
                document.getElementById('scooter-nom').textContent = gameState.selectedScooter.name;
            }

            gameState.running = true;
            gameState.distance = 0;
            gameState.speed = 5;   // le prof s'élance, l'accélération se voit
            gameState.battery = gameState.selectedScooter.battery;
            gameState.score = 0;
            gameState.player.x = canvas.width / 2 - gameState.player.width / 2;
            gameState.obstacles = [];
            gameState.decorations = [];
            gameState.currentWeather = weatherConditions[0];
            gameState.weatherTimer = 0;
            gameState.obstacleTimer = 0;
            gameState.decorationTimer = 0;
            gameState.roadOffset = 0;
            gameState.t = 0;
            gameState.rampe = 1;
            gameState.bonus = 0;
            gameState.popups = [];
            gameState.particules = [];
            gameState.meteoNom = '';
            gameState.flash = 0;
            gameState.player.vx = 0;
            gameState.demarrage = 55;
            gameState.poussiere = [];
            gameState.etoiles = [];
            gameState.crash = 0;
            gameState.motifFin = '';
            gameState.ballon = { x: 118, y: 150, phase: 0 };
            gameState.avion = { x: -90, y: 96, v: 1.7 };
            gameState.player.x = canvas.width / 2 - gameState.player.width / 2;

            afficherConsigne();
            updateWeatherDisplay();
            gameLoop();
        }
        
        function gameLoop() {
            if (!gameState.running) return;
            
            update();
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function update() {
            gameState.t++;
            if (gameState.demarrage > 0) gameState.demarrage--;

            // Changement météo aléatoire
            gameState.weatherTimer++;
            if (gameState.weatherTimer > 600) {
                if (Math.random() < 0.3) {
                    gameState.currentWeather = weatherConditions[Math.floor(Math.random() * weatherConditions.length)];
                    updateWeatherDisplay();
                }
                gameState.weatherTimer = 0;
            }

            // La difficulté monte : plus on avance, plus ça défile vite
            gameState.rampe = 1 + Math.min(0.9, gameState.distance / 2200);

            // Génération d'obstacles, de plus en plus dense
            gameState.obstacleTimer++;
            const obstacleFrequency = Math.max(12, 55 - (gameState.distance / 22));
            if (gameState.obstacleTimer > obstacleFrequency) {
                if (Math.random() < 0.8) {
                    spawnObstacle();
                }
                gameState.obstacleTimer = 0;
            }

            // Génération de décorations
            gameState.decorationTimer++;
            if (gameState.decorationTimer > 48) {
                if (Math.random() < 0.5) {
                    spawnDecoration();
                }
                gameState.decorationTimer = 0;
            }

            // Contrôle joueur (flèches ou ZQSD/WASD)
            const moveSpeed = 8 * gameState.currentWeather.grip;
            const k = gameState.keys;
            if ((k['ArrowLeft'] || k['a'] || k['q']) && gameState.player.x > 50) {
                gameState.player.vx = -moveSpeed;
            } else if ((k['ArrowRight'] || k['d']) && gameState.player.x < canvas.width - 50 - gameState.player.width) {
                gameState.player.vx = moveSpeed;
            } else {
                gameState.player.vx *= 0.82;
            }

            // Accélération/freinage (le vent et la pluie freinent : interacteurs)
            const maxSpeed = gameState.selectedScooter.speed * gameState.currentWeather.grip * gameState.rampe;
            if (k['ArrowUp'] || k['w'] || k['z']) {
                gameState.speed = Math.min(maxSpeed, gameState.speed + 0.5);
            } else if (k['ArrowDown'] || k['s']) {
                gameState.speed = Math.max(6, gameState.speed - 0.7);
            } else {
                const cruiseSpeed = maxSpeed * 0.78;
                if (gameState.speed < cruiseSpeed) {
                    gameState.speed = Math.min(cruiseSpeed, gameState.speed + 0.38);
                } else {
                    gameState.speed = Math.max(cruiseSpeed, gameState.speed - 0.22);
                }
            }

            gameState.player.x += gameState.player.vx;
            gameState.player.x = Math.max(50, Math.min(canvas.width - 50 - gameState.player.width, gameState.player.x));

            // Saut : Espace ou flèche haut pour sauter par-dessus les barrières
            if ((k[' '] || k['ArrowUp']) && !gameState.player.saut) {
                gameState.player.saut = true;
                gameState.player.vy = -14; // impulsion vers le haut
            }
            // Physique du saut
            if (gameState.player.saut) {
                gameState.player.y += gameState.player.vy;
                gameState.player.vy += 0.9; // gravité
                // Retour au sol
                if (gameState.player.y >= gameState.player.solY) {
                    gameState.player.y = gameState.player.solY;
                    gameState.player.saut = false;
                    gameState.player.vy = 0;
                }
            }

            // Poussière derrière la roue : au départ et à haute vitesse
            const cxJ = gameState.player.x + gameState.player.width / 2;
            const cyJ = gameState.player.y + gameState.player.height / 2;
            if (gameState.t % 2 === 0 && (gameState.demarrage > 0 || gameState.speed > 23)) {
                gameState.poussiere.push({
                    x: cxJ + (Math.random() - 0.5) * 16,
                    y: cyJ + 44,
                    vx: (Math.random() - 0.5) * 0.9,
                    vy: 1.5 + Math.random() * 1.5,
                    r: 1.5 + Math.random() * 2.5,
                    age: 0
                });
            }
            gameState.poussiere.forEach(p => { p.x += p.vx; p.y += p.vy; p.age++; });
            gameState.poussiere = gameState.poussiere.filter(p => p.age < 26);

            // Défilement vertical : la route descend, les lignes jaunes aussi (ralenti)
            gameState.scrollSpeed = gameState.speed / 3.5;
            gameState.distance += gameState.scrollSpeed * 0.058;
            gameState.roadOffset += gameState.scrollSpeed;

            // Mise à jour obstacles
            gameState.obstacles.forEach(obs => {
                // Les voitures avancent plus vite que le défilement
                const vitesseObs = obs.type === 'car' ? gameState.scrollSpeed * 1.6 : gameState.scrollSpeed;
                obs.y += vitesseObs;
                obs.age = (obs.age || 0) + 1;
            });

            // Un obstacle passé sans le toucher rapporte des points
            gameState.obstacles.forEach(obs => {
                if (!obs.compte && obs.y > gameState.player.y + gameState.player.height) {
                    obs.compte = true;
                    gameState.bonus += 10;
                    ajouterPopup(obs.x + obs.width / 2, obs.y, '+10', '#2ecc71');
                }
            });

            gameState.obstacles = gameState.obstacles.filter(obs => obs.y < canvas.height + 120);

            // Mise à jour décorations
            gameState.decorations.forEach(dec => {
                dec.y += gameState.scrollSpeed;
                dec.age = (dec.age || 0) + 1;
            });
            gameState.decorations = gameState.decorations.filter(dec => dec.y < canvas.height + 80);

            // Collision
            gameState.obstacles.forEach(obs => {
                if (checkCollision(gameState.player, obs, obs.type)) {
                    endGame(false);
                }
            });

            // Consommation batterie
            const batteryDrain = 0.011 * gameState.currentWeather.batteryDrain * (gameState.speed / 20);
            gameState.battery -= batteryDrain;

            if (gameState.battery <= 0) {
                gameState.battery = 0;
                endGame(true);
            }

            // Affichage
            document.getElementById('distance').textContent = Math.floor(gameState.distance);
            document.getElementById('speed').textContent = Math.floor(gameState.speed);
            const elBat = document.getElementById('battery');
            elBat.textContent = Math.floor(gameState.battery);
            elBat.style.color = (gameState.battery < 20 && Math.floor(gameState.t / 12) % 2 === 0)
                ? '#e74c3c' : '';
            gameState.score = Math.floor(gameState.distance) + gameState.bonus;
            document.getElementById('score').textContent = gameState.score;
        }

        function afficherConsigne() {
            const c = document.getElementById('controls');
            if (c) {
                c.textContent = '← → ou glisser le doigt pour se déplacer | ↑ accélérer | ↓ freiner | Espace pour sauter';
            }
        }

        function spawnObstacle() {
            const types = [
                { type: 'pothole', width: 50, height: 36, color: '#34495e' },
                { type: 'cone', width: 26, height: 32, color: '#e74c3c' },
                { type: 'pedestrian', width: 36, height: 50, color: '#9b59b6' },
                { type: 'car', width: 104, height: 156, color: '#3498db' },
                { type: 'puddle', width: 58, height: 30, color: '#5dade2' },
                { type: 'leaves', width: 54, height: 28, color: '#d35400' },
                { type: 'barriere', width: 60, height: 40, color: '#e74c3c' }
            ];
            
            const template = types[Math.floor(Math.random() * types.length)];
            const laneWidth = (canvas.width - 100) / 3;
            const lane = Math.floor(Math.random() * 3);
            const x = 50 + lane * laneWidth + (laneWidth - template.width) / 2;
            
            gameState.obstacles.push({
                x: x,
                y: -template.height,
                width: template.width,
                height: template.height,
                type: template.type,
                color: template.color
            });
        }
        
        function spawnDecoration() {
            const side = Math.random() < 0.5 ? 'left' : 'right';
            const type = Math.random() < 0.6 ? 'tree' : 'flower';
            const largeur = type === 'tree' ? 56 : 34;
            const x = side === 'left'
                ? 22 + Math.random() * 16
                : canvas.width - 22 - Math.random() * 16;
            gameState.decorations.push({
                x: x,
                y: -40,
                largeur: largeur,
                type: type,
                age: 0
            });
        }
        
        function checkCollision(rect1, rect2, obstacleType) {
            const padding = 5;
            // Si le joueur saute et que l'obstacle est une barrière, pas de collision
            if (gameState.player.saut && obstacleType === 'barriere') {
                return false;
            }
            return rect1.x + padding < rect2.x + rect2.width &&
                   rect1.x + rect1.width - padding > rect2.x &&
                   rect1.y + padding < rect2.y + rect2.height &&
                   rect1.y + rect1.height - padding > rect2.y;
        }
        
        function render() {
            const t = gameState.t;

            // Ciel et soleil
            const degrade = ctx.createLinearGradient(0, 0, 0, canvas.height);
            degrade.addColorStop(0, '#87ceeb');
            degrade.addColorStop(1, '#c9e9f6');
            ctx.fillStyle = degrade;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            dessinerSoleil(t);

            // Nuages qui dérivent
            gameState.nuages.forEach(n => {
                n.x += n.v;
                if (n.x > canvas.width + 70) n.x = -70;
                dessiner('nuage', n.x, n.y + Math.sin((t + n.x) / 90) * 2, 0, n.e);
            });

            // Ciel vivant : ballon qui monte et avion en papier qui traverse
            gameState.ballon.phase += 0.02;
            gameState.ballon.y -= 0.28;
            gameState.ballon.x += Math.sin(gameState.ballon.phase) * 0.5;
            if (gameState.ballon.y < -50) {
                gameState.ballon.y = canvas.height * 0.45;
                gameState.ballon.x = 70 + Math.random() * 130;
            }
            dessiner('ballon', gameState.ballon.x, gameState.ballon.y, Math.sin(gameState.ballon.phase) * 0.12);

            gameState.avion.x += gameState.avion.v;
            if (gameState.avion.x > canvas.width + 90) {
                gameState.avion.x = -90;
                gameState.avion.y = 70 + Math.random() * 90;
            }
            dessiner('avion', gameState.avion.x, gameState.avion.y + Math.sin(gameState.avion.x / 70) * 6, -0.1);

            // Animation d'impact : on secoue le monde
            ctx.save();
            if (gameState.shake > 0) {
                ctx.translate((Math.random() - 0.5) * gameState.shake, (Math.random() - 0.5) * gameState.shake);
                gameState.shake *= 0.85;
                if (gameState.shake < 0.5) gameState.shake = 0;
            }

            // Route
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(50, 0, canvas.width - 100, canvas.height);

            // Grain d'asphalte : il défile vers le bas, comme la route
            ctx.fillStyle = '#6c7a89';
            const pasGrain = 46;
            const depGrain = gameState.roadOffset % pasGrain;
            for (let gy = depGrain - pasGrain; gy < canvas.height + pasGrain; gy += pasGrain) {
                for (let gx = 62; gx < canvas.width - 62; gx += 94) {
                    ctx.fillRect(gx, gy, 3, 3);
                    ctx.fillRect(gx + 43, gy + 21, 2, 2);
                }
            }

            // Lignes jaunes : elles descendent avec la route (sens corrigé)
            const laneWidth = (canvas.width - 100) / 3;
            const pasLigne = 48;
            const longueurLigne = 28;
            const depLigne = gameState.roadOffset % pasLigne;
            for (let lane = 1; lane < 3; lane++) {
                const x = 50 + lane * laneWidth - 4;
                for (let y = depLigne - pasLigne; y < canvas.height + pasLigne; y += pasLigne) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(x, y, 8, longueurLigne);
                    ctx.fillStyle = '#d4ac0d';
                    ctx.fillRect(x + 8, y, 2, longueurLigne);
                }
            }

            // Bordures de route
            ctx.fillStyle = '#ecf0f1';
            ctx.fillRect(45, 0, 6, canvas.height);
            ctx.fillRect(canvas.width - 51, 0, 6, canvas.height);
            ctx.fillStyle = '#bdc3c7';
            for (let y = 0; y < canvas.height; y += 20) {
                ctx.fillRect(45, y, 6, 2);
                ctx.fillRect(canvas.width - 51, y, 6, 2);
            }

            // Décorations
            gameState.decorations.forEach(dec => {
                if (dec.type === 'tree') {
                    drawTree(dec);
                } else {
                    drawFlower(dec);
                }
            });

            // Obstacles
            gameState.obstacles.forEach(obs => {
                drawObstacle(obs);
            });

            // Poussière derrière la roue, puis le prof
            dessinerPoussiere();
            drawPlayer();

            // Lignes de vitesse quand ça va vite
            const v = gameState.speed;
            if (v > 24) {
                const intensite = Math.min(1, (v - 24) / 14);
                ctx.save();
                ctx.globalAlpha = 0.22 + intensite * 0.3;
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 6; i++) {
                    const y = ((t * (6 + v * 0.35) + i * 120) % (canvas.height + 120)) - 60;
                    const dx = (i % 2) ? 58 : canvas.width - 66;
                    ctx.fillRect(dx, y, 4, 16 + intensite * 22);
                }
                ctx.restore();
            }

            ctx.restore();

            // Étoiles de la chute
            dessinerEtoiles();

            // Ambiance météo et « +10 »
            meteoAmbiance();
            dessinerPopups();

            // Flash rouge de fin de partie
            if (gameState.flash > 0) {
                ctx.save();
                ctx.globalAlpha = Math.min(0.55, gameState.flash / 24);
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
                gameState.flash--;
            }
        }

        // ---------- Outils de dessin des sprites ----------
        function dessiner(nom, cx, cy, angle, echelle) {
            const img = sprite(nom);
            if (!img) return false;
            const e = echelle || 1;
            const largeur = img.naturalWidth * e;
            const hauteur = img.naturalHeight * e;
            ctx.save();
            ctx.translate(Math.round(cx), Math.round(cy));
            if (angle) ctx.rotate(angle);
            ctx.drawImage(img, -largeur / 2, -hauteur / 2, largeur, hauteur);
            ctx.restore();
            return true;
        }

        function ombreAuSol(cx, cy, rx, ry, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha === undefined ? 0.22 : alpha;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function dessinerSoleil(t) {
            const cx = canvas.width - 82;
            const cy = 84;
            const pulsation = 1 + Math.sin(t / 26) * 0.06;
            ctx.save();
            ctx.globalAlpha = 0.55;
            ctx.fillStyle = '#f9ca24';
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI / 4) * i + t / 420;
                const rayon = 34 * pulsation;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                ctx.fillRect(-3, -rayon - 10, 6, 12);
                ctx.restore();
            }
            ctx.restore();
            ctx.fillStyle = '#f9ca24';
            ctx.beginPath();
            ctx.arc(cx, cy, 22 * pulsation, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            ctx.arc(cx, cy, 15 * pulsation, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawTree(dec) {
            ombreAuSol(dec.x + 4, dec.y + 12, 20, 8, 0.18);
            dessiner('arbre', dec.x, dec.y, Math.sin((dec.age || 0) / 40) * 0.03);
        }

        function drawFlower(dec) {
            dessiner('massif', dec.x, dec.y + Math.sin((dec.age || 0) / 20) * 1.5, 0, 1);
        }

        function drawObstacle(obs) {
            const cx = obs.x + obs.width / 2;
            const cy = obs.y + obs.height / 2;
            switch (obs.type) {
                case 'pothole':
                    dessiner('nidDePoule', cx, cy);
                    break;
                case 'cone':
                    dessiner('cone', cx, cy + Math.sin((obs.age || 0) / 9) * 0.8);
                    break;
                case 'pedestrian': {
                    // Cycle de marche de 4 images (élève 1 réutilisé tel quel),
                    // rabattu sur le sprite fixe si l'animation manque.
                    const pas = Math.floor((obs.age || 0) / 6) % 4 + 1;
                    const nom = sprite('pieton' + pas) ? 'pieton' + pas : 'pieton';
                    ombreAuSol(cx, cy + 26, 14, 6, 0.2);
                    dessiner(nom, cx, cy + Math.sin((obs.age || 0) / 6) * 0.8);
                    break;
                }
                case 'car':
                    ombreAuSol(cx + 5, cy + 64, 48, 18, 0.24);
                    dessiner('voiture', cx, cy);
                    // Phares qui clignotent doucement (proportionnels au sprite 128x192)
                    ctx.save();
                    ctx.globalAlpha = 0.5 + Math.sin((obs.age || 0) / 12) * 0.3;
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(cx - 46, cy - 88, 12, 6);
                    ctx.fillRect(cx + 34, cy - 88, 12, 6);
                    ctx.restore();
                    break;
                case 'puddle':
                    ctx.save();
                    ctx.globalAlpha = 0.85 + Math.sin((obs.age || 0) / 14) * 0.15;
                    dessiner('flaque', cx, cy);
                    ctx.restore();
                    break;
                case 'leaves':
                    dessiner('feuilles', cx, cy, Math.sin((obs.age || 0) / 18) * 0.06);
                    break;
                case 'barriere':
                    // Barrière rayée rouge et blanche
                    ctx.fillStyle = '#e74c3c';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.fillStyle = '#ffffff';
                    for (let i = 0; i < obs.width; i += 12) {
                        ctx.fillRect(obs.x + i, obs.y, 6, obs.height);
                    }
                    // Poteaux de support
                    ctx.fillStyle = '#7f8c8d';
                    ctx.fillRect(obs.x - 4, obs.y + obs.height, 6, 10);
                    ctx.fillRect(obs.x + obs.width - 2, obs.y + obs.height, 6, 10);
                    break;
                default:
                    ctx.fillStyle = obs.color || '#34495e';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }
        }

        function drawPlayer() {
            const cx = gameState.player.x + gameState.player.width / 2;
            const cy = gameState.player.y + gameState.player.height / 2;
            const t = gameState.t;

            // Chute : le prof bascule et glisse sur le côté
            if (gameState.crash > 0) {
                const p = Math.min(1, gameState.crash / 24);
                ombreAuSol(cx + 8 + p * 18, cy + 30, 20 + p * 12, 9, 0.3);
                dessiner('profTrottinette', cx + p * 18, cy + p * 12, (Math.PI / 2) * p);
                return;
            }

            const inclinaison = Math.max(-0.26, Math.min(0.26, gameState.player.vx * 0.032));
            const flottement = Math.sin(t / 6) * 1.4;
            const elan = gameState.demarrage > 0 ? Math.sin(t / 2.2) * 1.8 : 0;

            // Ombre au sol
            ombreAuSol(cx + 4, cy + 40, 20, 9, 0.25);

            // Traînée de vitesse sous la trottinette
            ctx.save();
            ctx.globalAlpha = 0.28;
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 3; i++) {
                const ly = cy + 48 + i * 7;
                const decal = (t * 3 + i * 11) % 14;
                ctx.fillRect(cx - 12 + decal * 0.4, ly, 7, 2);
                ctx.fillRect(cx + 5 - decal * 0.4, ly + 4, 7, 2);
            }
            ctx.restore();

            if (!dessiner('profTrottinette', cx + elan * 0.4, cy + flottement + elan, inclinaison)) {
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(cx - 16, cy - 26, 32, 52);
            }
        }

        function dessinerPoussiere() {
            if (!gameState.poussiere.length) return;
            ctx.save();
            gameState.poussiere.forEach(p => {
                ctx.globalAlpha = Math.max(0, 0.45 * (1 - p.age / 26));
                ctx.fillStyle = '#f2e3c4';
                const cote = Math.max(2, Math.round(p.r * 2));
                ctx.fillRect(Math.round(p.x), Math.round(p.y), cote, cote);
            });
            ctx.restore();
        }

        function dessinerEtoiles() {
            if (!gameState.etoiles.length) return;
            ctx.save();
            ctx.fillStyle = '#f9ca24';
            const cx = gameState.player.x + gameState.player.width / 2;
            const cy = gameState.player.y + gameState.player.height / 2 - 14;
            gameState.etoiles.forEach(e => {
                ctx.globalAlpha = Math.max(0, 1 - e.age / 50);
                const x = cx + Math.cos(e.angle) * e.r;
                const y = cy + Math.sin(e.angle) * e.r * 0.6;
                ctx.fillRect(Math.round(x) - 4, Math.round(y) - 1, 8, 2);
                ctx.fillRect(Math.round(x) - 1, Math.round(y) - 4, 2, 8);
            });
            ctx.restore();
        }
        function ajouterPopup(x, y, texte, couleur) {
            gameState.popups.push({ x: x, y: y, texte: texte, age: 0, couleur: couleur || '#fff' });
        }

        function dessinerPopups() {
            gameState.popups = gameState.popups.filter(p => p.age < 55);
            gameState.popups.forEach(p => {
                p.age++;
                ctx.save();
                ctx.globalAlpha = Math.max(0, 1 - p.age / 55);
                ctx.font = 'bold 16px "Courier New", monospace';
                ctx.fillStyle = '#1a1a2e';
                ctx.fillText(p.texte, p.x + 2, p.y - p.age * 0.8 + 2);
                ctx.fillStyle = p.couleur;
                ctx.fillText(p.texte, p.x, p.y - p.age * 0.8);
                ctx.restore();
            });
        }

        function meteoAmbiance() {
            const nom = gameState.currentWeather.name;
            const t = gameState.t;

            if (gameState.meteoNom !== nom) {
                gameState.meteoNom = nom;
                gameState.particules = [];
                const nombre = nom === 'Pluie' ? 70 : (nom === 'Froid' ? 45 : (nom === 'Vent' ? 26 : 0));
                for (let i = 0; i < nombre; i++) {
                    gameState.particules.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        v: 4 + Math.random() * 6,
                        r: 1 + Math.random() * 2
                    });
                }
            }

            if (nom === 'Pluie') {
                ctx.strokeStyle = 'rgba(52, 152, 219, 0.55)';
                ctx.lineWidth = 2;
                gameState.particules.forEach(p => {
                    p.y += p.v;
                    p.x -= p.v * 0.35;
                    if (p.y > canvas.height) { p.y = -12; p.x = Math.random() * canvas.width; }
                    if (p.x < -12) p.x = canvas.width + 12;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - 2, p.y - 14);
                    ctx.stroke();
                });
                ctx.save();
                ctx.globalAlpha = 0.12;
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            } else if (nom === 'Froid') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                gameState.particules.forEach(p => {
                    p.y += p.v * 0.55;
                    p.x += Math.sin((t + p.y) / 40) * 0.6;
                    if (p.y > canvas.height) { p.y = -8; p.x = Math.random() * canvas.width; }
                    ctx.fillRect(p.x, p.y, p.r * 2, p.r * 2);
                });
                ctx.save();
                ctx.globalAlpha = 0.1;
                ctx.fillStyle = '#d6eaf8';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            } else if (nom === 'Vent') {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
                ctx.lineWidth = 2;
                gameState.particules.forEach(p => {
                    p.y += p.v * 0.8;
                    p.x -= 6 + p.v;
                    if (p.y > canvas.height) { p.y = -10; p.x = canvas.width + 20; }
                    if (p.x < -30) { p.x = canvas.width + 20; p.y = Math.random() * canvas.height; }
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + 16, p.y + 3);
                    ctx.stroke();
                });
            } else if (nom === 'Chaleur') {
                ctx.save();
                ctx.globalAlpha = 0.1 + Math.sin(t / 40) * 0.03;
                ctx.fillStyle = '#f39c12';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.globalAlpha = 0.08;
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 5; i++) {
                    const y = ((t * 1.2 + i * 130) % (canvas.height + 60)) - 30;
                    ctx.fillRect(0, y, canvas.width, 8);
                }
                ctx.restore();
            } else {
                // Beau temps : éclat doux qui respire
                ctx.save();
                ctx.globalAlpha = 0.05 + Math.sin(t / 50) * 0.02;
                ctx.fillStyle = '#f9ca24';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
        }

        function updateWeatherDisplay() {
            document.getElementById('weather-text').textContent = 
                `${gameState.currentWeather.icon} ${gameState.currentWeather.name}`;
        }
        
        function endGame(batteryEmpty) {
            if (!gameState.running) return;
            gameState.running = false;
            gameState.motifFin = batteryEmpty ? 'batterie' : 'crash';
            gameState.flash = batteryEmpty ? 12 : 22;
            gameState.shake = batteryEmpty ? 8 : 22;
            if (!batteryEmpty) {
                gameState.crash = 1;
                for (let i = 0; i < 8; i++) {
                    gameState.etoiles.push({ angle: (Math.PI * 2 / 8) * i, r: 24, age: 0 });
                }
            }
            // Petite scène de fin (≈ 1 s) avant le panneau de score
            let trames = 0;
            (function sceneDeFin() {
                if (!batteryEmpty) gameState.crash++;
                gameState.etoiles.forEach(e => { e.age++; e.angle += 0.16; e.r += 0.9; });
                gameState.etoiles = gameState.etoiles.filter(e => e.age < 50);
                render();
                if (trames++ < 55) requestAnimationFrame(sceneDeFin);
                else afficherFin(batteryEmpty);
            })();
        }

        function afficherFin(batteryEmpty) {
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('final-score').textContent =
                `⭐ Score: ${gameState.score} points`;
            document.getElementById('final-distance').textContent =
                batteryEmpty ?
                "🔋 Plus de batterie ! Tu as parcouru " + Math.floor(gameState.distance) + " m" :
                "💥 Crash ! Tu as parcouru " + Math.floor(gameState.distance) + " m";
        }

        function resetGame() {
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('weather-indicator').classList.add('hidden');
            gameState.selectedScooter = null;
            document.querySelectorAll('.scooter-option').forEach(el => el.classList.remove('selected'));
            document.getElementById('start-btn').disabled = true;
        }
        
        document.addEventListener('keydown', (e) => {
            gameState.keys[e.key] = true;
            const k = (e.key || '').toLowerCase();
            if (k) gameState.keys[k] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });

        // Pilotage tactile / souris : on glisse sur la piste
        let doigtActif = false;
        function deplacerVers(clientX) {
            const rect = canvas.getBoundingClientRect();
            const x = (clientX - rect.left) * (canvas.width / rect.width);
            gameState.player.vx = 0;
            gameState.player.x = Math.max(50, Math.min(canvas.width - 50 - gameState.player.width,
                                                      x - gameState.player.width / 2));
        }
        canvas.addEventListener('pointerdown', (e) => {
            doigtActif = true;
            if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
            if (gameState.running) deplacerVers(e.clientX);
        });
        canvas.addEventListener('pointermove', (e) => {
            if (doigtActif && gameState.running) deplacerVers(e.clientX);
        });
        canvas.addEventListener('pointerup', () => { doigtActif = false; });
        canvas.addEventListener('pointercancel', () => { doigtActif = false; });
        
        document.addEventListener('keyup', (e) => {
            gameState.keys[e.key] = false;
            const k = (e.key || '').toLowerCase();
            if (k) gameState.keys[k] = false;
        });
        
        document.getElementById('start-btn').onclick = startGame;
        document.getElementById('restart-btn').onclick = () => {
            document.getElementById('game-over').classList.add('hidden');
            startGame();
        };
        document.getElementById('menu-btn').onclick = resetGame;
        
        initMenu();
        prechargerAssets();
    </script>
</body>
</html>
